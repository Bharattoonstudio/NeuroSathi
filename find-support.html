<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<title>Find Support — NeuroSarathi</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:#fffaf5;color:#0e1524;min-height:100vh}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:600}
  .topbar{background:#0e1524;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
  .topbar .brand{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:1.1rem}
  .topbar a{color:#fff;text-decoration:none;font-size:.85rem;border:1px solid rgba(255,255,255,.3);padding:6px 14px;border-radius:50px}
  .wrap{max-width:720px;margin:0 auto;padding:20px}
  .filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
  .filters button{flex:none;padding:9px 16px;border-radius:50px;border:1.5px solid #E5E7EB;background:#fff;font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer;color:#57534E}
  .filters button.active{background:#0e1524;color:#fff;border-color:#0e1524}
  .search-box{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #E5E7EB;margin-bottom:16px;font-family:inherit;font-size:.9rem;box-sizing:border-box}
  .card{background:#fff;border:1px solid #f2e4d6;border-radius:16px;padding:16px;margin-bottom:12px}
  .card .type-tag{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#ff8a5c;margin-bottom:4px}
  .verified-tag{display:inline-flex;align-items:center;gap:3px;font-size:.68rem;font-weight:800;color:#065F46;background:#D1FAE5;padding:3px 9px;border-radius:20px;margin-left:6px;vertical-align:middle}
  .roster-item{background:#fffaf5;border:1px solid #f2e4d6;border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .roster-item .rname{font-weight:700;font-size:.95rem}
  .roster-item .rmeta{font-size:.8rem;color:#7b8194;margin:2px 0 6px}
  .roster-item .rbio{font-size:.82rem;color:#57534E;margin-bottom:8px}
  .roster-chip{display:inline-block;background:#FFF7ED;color:#9A3412;border:1px solid #FED7AA;border-radius:20px;padding:3px 10px;font-size:.72rem;font-weight:700;margin:0 4px 4px 0}
  .card .name{font-size:1.05rem;font-weight:700}
  .card .meta{font-size:.83rem;color:#7b8194;margin:4px 0 10px}
  .card .fee{font-size:.9rem;font-weight:700;color:#0e1524;margin-bottom:10px}
  .card .bio{font-size:.85rem;color:#57534E;margin-bottom:12px;line-height:1.5}
  .book-btn{background:linear-gradient(135deg,#ff8a5c,#ffb083);color:#fff;border:none;border-radius:50px;padding:11px 22px;font-family:inherit;font-size:.85rem;font-weight:800;cursor:pointer}
  .book-btn:disabled{opacity:.5;cursor:not-allowed}
  .empty-note{color:#888;font-size:.88rem;padding:40px 20px;text-align:center}
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end;justify-content:center}
  .modal-bg.active{display:flex}
  .provider-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;margin-bottom:10px;cursor:pointer;background:#f4f2ee}
  .profile-photo-lg{width:96px;height:96px;border-radius:50%;object-fit:cover;margin:0 auto 12px;display:block;background:#f4f2ee}
  .profile-avatar-placeholder{width:96px;height:96px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:#ffe4d6;color:#ff8a5c;font-size:2.2rem;font-weight:800;font-family:'Space Grotesk',sans-serif}
  .modal{background:#fff;border-radius:20px 20px 0 0;padding:24px 20px 32px;width:100%;max-width:480px}
  .modal h3{font-size:1.15rem;margin-bottom:6px}
  .modal .sub{font-size:.85rem;color:#7b8194;margin-bottom:18px}
  .modal label{display:block;font-size:.8rem;font-weight:700;color:#57534E;margin-bottom:6px}
  .modal input,.modal textarea{width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid #E5E7EB;margin-bottom:14px;font-family:inherit;font-size:.88rem;box-sizing:border-box}
  .amount-row{display:flex;justify-content:space-between;align-items:center;background:#fffaf5;border-radius:12px;padding:14px 16px;margin-bottom:16px}
  .amount-row .label{font-size:.85rem;color:#57534E}
  .amount-row .value{font-size:1.3rem;font-weight:800;font-family:'Space Grotesk',sans-serif}
  .fee-note{font-size:.75rem;color:#A8A29E;margin-top:-10px;margin-bottom:16px}
  .modal-actions{display:flex;gap:10px}
  .modal-actions button{flex:1;padding:13px;border-radius:50px;font-family:inherit;font-size:.9rem;font-weight:800;cursor:pointer;border:none}
  .btn-cancel{background:#F3F4F6;color:#57534E}
  .btn-pay{background:linear-gradient(135deg,#ff8a5c,#ffb083);color:#fff}
  .btn-pay:disabled{opacity:.6;cursor:not-allowed}
  .status-msg{font-size:.82rem;margin-top:10px;min-height:1em;color:#c0392b}
  .success-msg{font-size:.85rem;color:#2a7b47;font-weight:700}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">Find Support</div>
  <a href="/parents.html">← Dashboard</a>
</div>

<div class="wrap">
  <div class="filters" style="margin-bottom:14px">
    <button class="active" id="navFind" onclick="showView('find')">Find Support</button>
    <button id="navBookings" onclick="showView('bookings')">My Bookings</button>
  </div>

  <div id="findView">
  <input class="search-box" id="searchBox" placeholder="Search by name, city, or language…" oninput="renderList()">
  <div class="filters" id="filterRow">
    <button class="active" data-f="all" onclick="setFilter('all')">All</button>
    <button data-f="professional" onclick="setFilter('professional')">Doctors & Therapists</button>
    <button data-f="educator" onclick="setFilter('educator')">Educators & Tutors</button>
    <button data-f="caregiver" onclick="setFilter('caregiver')">Caregivers</button>
    <button data-f="agency" onclick="setFilter('agency')">Agencies</button>
  </div>
  <div id="listMount"><div class="empty-note">Loading…</div></div>
  </div>

  <div id="bookingsView" style="display:none">
    <div id="myBookingsListMount"><div class="empty-note">Loading…</div></div>
  </div>
</div>

<!-- Booking modal -->
<div class="modal-bg" id="bookModalBg">
  <div class="modal">
    <h3 id="bookModalName">Book a consultation</h3>
    <div class="sub" id="bookModalMeta"></div>

    <div id="bookFormArea">
      <label>Your name</label>
      <input type="text" id="bookParentName" placeholder="For the provider's records">
      <label>Your phone / WhatsApp number</label>
      <input type="tel" id="bookParentPhone" placeholder="Shared with the provider once you pay">
      <label>Preferred date</label>
      <input type="date" id="bookDate">
      <label>Notes for the provider (optional)</label>
      <textarea id="bookNotes" rows="2" placeholder="What would you like help with?"></textarea>

      <div class="amount-row">
        <div class="label">Consultation fee</div>
        <div class="value" id="bookAmountDisplay">₹0</div>
      </div>
      <div class="fee-note">You'll pay this now via Razorpay to confirm your booking.</div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeBookModal()">Cancel</button>
        <button class="btn-pay" id="payBtn" onclick="startPayment()">Pay & Book →</button>
      </div>
      <div class="status-msg" id="bookStatusMsg"></div>
    </div>

    <div id="bookSuccessArea" style="display:none">
      <p class="success-msg">✓ Booking confirmed! The provider has been notified. You can see this booking anytime from your dashboard.</p>
      <div class="modal-actions" style="margin-top:16px">
        <button class="btn-pay" style="flex:1" onclick="closeBookModal()">Done</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg" id="rosterModalBg">
  <div class="modal">
    <h3 id="rosterModalName">Agency caregivers</h3>
    <div class="sub" id="rosterModalMeta"></div>
    <div id="rosterModalList"></div>
    <div class="modal-actions" style="margin-top:16px">
      <button class="btn-cancel" style="flex:1" onclick="closeRosterViewModal()">Close</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="reviewsModalBg">
  <div class="modal">
    <h3 id="reviewsModalName">Reviews</h3>
    <div class="sub" id="reviewsModalMeta"></div>
    <div id="reviewsModalList"></div>
    <div class="modal-actions" style="margin-top:16px">
      <button class="btn-cancel" style="flex:1" onclick="closeReviewsModal()">Close</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="profileModalBg">
  <div class="modal" id="profileModalBody" style="max-height:85vh;overflow-y:auto"></div>
</div>

<script>
const NS_URL = 'https://qvuenvngwgcknawfsnxl.supabase.co';
const NS_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2dWVudm5nd2dja25hd2ZzbnhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3MzI1OTksImV4cCI6MjA5ODMwODU5OX0.MZgac469tvi9Xq9gyaRbHDc9t88Ww9dN8ldZ8JvKGVI';
let sb = null;
let currentUserId = null;
let allProviders = [];
let activeFilter = 'all';
let selectedProvider = null;

const PROF_TYPE_LABELS = {
  developmental_pediatrician: 'Developmental Pediatrician',
  child_psychiatrist: 'Child Psychiatrist',
  occupational_therapist: 'Occupational Therapist',
  speech_language_pathologist: 'Speech-Language Pathologist',
  applied_behavior_analyst: 'Applied Behavior Analyst (ABA)',
  clinical_psychologist: 'Clinical Psychologist',
  physiotherapist: 'Physiotherapist',
  dietitian: 'Dietitian',
  special_educator: 'Special Educator',
};
const CAREGIVER_TYPE_LABELS = {
  babysitter: 'Babysitting / Childcare',
  home_tutor: 'Home Tutor',
  special_needs_caregiver: 'Special Needs Caregiver',
  respite_care: 'Respite Care',
};

(async function init(){
  sb = window.supabase.createClient(NS_URL, NS_KEY);
  const { data: userData } = await sb.auth.getUser();
  if (!userData || !userData.user) {
    window.location.href = '/enterportal.html?redirect=find-support.html';
    return;
  }
  currentUserId = userData.user.id;
  await loadProviders();
})();

async function loadProviders(){
  const mount = document.getElementById('listMount');
  try{
    const [{ data: pros, error: proErr }, { data: cgs, error: cgErr }, { data: agcs, error: agcErr }] = await Promise.all([
      sb.from('professionals')
        .select('id, user_id, professional_type, display_name, city, state, area, bio, consultation_fee_min, consultation_fee_max, verification_status, qualifications, years_of_experience, intro_video_url, languages_spoken, photo_url'),
      sb.from('caregivers')
        .select('user_id, caregiver_type, display_name, city, state, area, bio, hourly_rate_min, hourly_rate_max, verification_status, qualifications, years_experience, intro_video_url, languages_spoken, photo_url'),
      sb.from('agencies')
        .select('id, user_id, agency_name, city, state, area, bio, hourly_rate_min, hourly_rate_max, verification_status, languages_spoken, intro_video_url, photo_url'),
    ]);
    if (proErr) console.error(proErr);
    if (cgErr) console.error(cgErr);
    if (agcErr) console.error(agcErr);

    const proList = (pros || []).map(p => ({
      kind: (p.professional_type === 'special_educator' || p.professional_type === 'home_tutor') ? 'educator' : 'professional',
      providerId: p.id,
      name: p.display_name,
      typeLabel: PROF_TYPE_LABELS[p.professional_type] || p.professional_type,
      city: p.city, state: p.state, area: p.area,
      bio: p.bio,
      feeMin: p.consultation_fee_min, feeMax: p.consultation_fee_max,
      qualifications: p.qualifications, yearsExp: p.years_of_experience, videoUrl: p.intro_video_url,
      languages: p.languages_spoken || [],
      photoUrl: p.photo_url || null,
    }));
    const cgList = (cgs || []).map(c => ({
      kind: 'caregiver',
      providerId: c.user_id,
      name: c.display_name,
      typeLabel: CAREGIVER_TYPE_LABELS[c.caregiver_type] || c.caregiver_type,
      city: c.city, state: c.state, area: c.area,
      bio: c.bio,
      feeMin: c.hourly_rate_min, feeMax: c.hourly_rate_max,
      qualifications: c.qualifications, yearsExp: c.years_experience, videoUrl: c.intro_video_url,
      languages: c.languages_spoken || [],
      photoUrl: c.photo_url || null,
    }));

    let rosterByAgency = {};
    if (agcs && agcs.length){
      const agencyIds = agcs.map(a => a.id);
      const { data: rosterRows, error: rosterErr } = await sb.from('agency_caregivers')
        .select('id, agency_id, name, years_experience, specializations, languages_spoken, bio')
        .in('agency_id', agencyIds)
        .eq('active', true);
      if (rosterErr) console.error(rosterErr);
      (rosterRows || []).forEach(r => {
        if (!rosterByAgency[r.agency_id]) rosterByAgency[r.agency_id] = [];
        rosterByAgency[r.agency_id].push(r);
      });
    }
    const agencyList = (agcs || []).map(a => ({
      kind: 'agency',
      providerId: a.user_id,
      agencyId: a.id,
      name: a.agency_name,
      typeLabel: 'Agency',
      city: a.city, state: a.state, area: a.area,
      bio: a.bio,
      feeMin: a.hourly_rate_min, feeMax: a.hourly_rate_max,
      videoUrl: a.intro_video_url,
      languages: a.languages_spoken || [],
      roster: rosterByAgency[a.id] || [],
      photoUrl: a.photo_url || null,
    }));

    allProviders = [...proList, ...cgList, ...agencyList];
    await loadRatingsSummary();
    renderList();
  }catch(err){
    console.error('Load providers error:', err);
    mount.innerHTML = '<div class="empty-note">Something went wrong loading the directory. Please try again.</div>';
  }
}

let ratingsSummary = {};
async function loadRatingsSummary(){
  try{
    const { data } = await sb.from('ratings').select('provider_type, provider_id, stars');
    ratingsSummary = {};
    (data || []).forEach(r => {
      const key = r.provider_type + ':' + r.provider_id;
      if (!ratingsSummary[key]) ratingsSummary[key] = { sum: 0, count: 0 };
      ratingsSummary[key].sum += r.stars;
      ratingsSummary[key].count += 1;
    });
  }catch(err){
    console.error('Load ratings summary error:', err);
  }
}

function setFilter(f){
  activeFilter = f;
  document.querySelectorAll('#filterRow button').forEach(b => b.classList.toggle('active', b.dataset.f === f));
  renderList();
}

function renderList(){
  const mount = document.getElementById('listMount');
  const q = (document.getElementById('searchBox').value || '').toLowerCase();
  const filtered = allProviders.filter(p =>
    (activeFilter === 'all' || p.kind === activeFilter) &&
    ((p.name || '').toLowerCase().includes(q) || (p.city || '').toLowerCase().includes(q) || (p.languages || []).some(l => l.toLowerCase().includes(q)))
  );
  if (!filtered.length){
    mount.innerHTML = `<div class="empty-note">${allProviders.length ? 'No matches. Try a different search.' : 'No providers listed yet — check back soon.'}</div>`;
    return;
  }
  mount.innerHTML = filtered.map((p, i) => {
    const loc = [p.area, p.city, p.state].filter(Boolean).join(', ');
    const feeLabel = feeRangeLabel(p);
    const ratingKey = p.kind + ':' + p.providerId;
    const rs = ratingsSummary[ratingKey];
    const ratingLabel = rs ? `★ ${(rs.sum / rs.count).toFixed(1)} (${rs.count})` : 'No ratings yet';
    const expLabel = p.yearsExp ? ` · ${p.yearsExp} yrs experience` : '';

    const ratingHtml = rs ? `<span style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted" onclick='openReviewsModal(${JSON.stringify(p.kind)}, ${JSON.stringify(p.providerId)}, ${JSON.stringify(p.name)})'>${escapeHtml(ratingLabel)}</span>` : escapeHtml(ratingLabel);

    if (p.kind === 'agency'){
      const rosterCount = (p.roster || []).length;
      return `
        <div class="card">
          ${p.photoUrl ? `<img src="${escapeHtml(p.photoUrl)}" class="provider-thumb" alt="" loading="lazy" onclick='openProviderProfile(${JSON.stringify(p).replace(/'/g, "&#39;")})'>` : ''}
          <div class="type-tag">${escapeHtml(kindLabel(p.kind))}</div>
          <div class="name" style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted" onclick='openProviderProfile(${JSON.stringify(p).replace(/'/g, "&#39;")})'>${escapeHtml(p.name)}</div>
          <div class="meta">${loc ? escapeHtml(loc) : ''} · ${ratingHtml}</div>
          ${p.languages && p.languages.length ? `<div style="font-size:.82rem;color:#57534E;margin-bottom:6px"><strong>Speaks:</strong> ${escapeHtml(p.languages.join(', '))}</div>` : ''}
          ${p.bio ? `<div class="bio">${escapeHtml(p.bio)}</div>` : ''}
          ${p.videoUrl ? renderVideoEmbed(p.videoUrl) : ''}
          <div class="fee">${feeLabel}</div>
          <button class="book-btn" ${rosterCount ? '' : 'disabled'} onclick='openRosterViewModal(${JSON.stringify(p).replace(/'/g, "&#39;")})'>${rosterCount ? `View Caregivers (${rosterCount}) →` : 'No caregivers listed yet'}</button>
        </div>
      `;
    }

    return `
      <div class="card">
        ${p.photoUrl ? `<img src="${escapeHtml(p.photoUrl)}" class="provider-thumb" alt="" loading="lazy" onclick='openProviderProfile(${JSON.stringify(p).replace(/'/g, "&#39;")})'>` : ''}
        <div class="type-tag">${escapeHtml(kindLabel(p.kind))}</div>
        <div class="name" style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted" onclick='openProviderProfile(${JSON.stringify(p).replace(/'/g, "&#39;")})'>${escapeHtml(p.name)}</div>
        <div class="meta">${escapeHtml(p.typeLabel)}${loc ? ' · ' + escapeHtml(loc) : ''}${expLabel} · ${ratingHtml}</div>
        ${p.qualifications ? `<div style="font-size:.82rem;color:#57534E;margin-bottom:6px"><strong>Qualifications:</strong> ${escapeHtml(p.qualifications)}</div>` : ''}
        ${p.languages && p.languages.length ? `<div style="font-size:.82rem;color:#57534E;margin-bottom:6px"><strong>Speaks:</strong> ${escapeHtml(p.languages.join(', '))}</div>` : ''}
        ${p.bio ? `<div class="bio">${escapeHtml(p.bio)}</div>` : ''}
        ${p.videoUrl ? renderVideoEmbed(p.videoUrl) : ''}
        <div class="fee">${feeLabel}</div>
        <button class="book-btn" ${p.feeMin ? '' : 'disabled'} onclick='openBookModal(${JSON.stringify(p).replace(/'/g, "&#39;")})'>${p.feeMin ? 'Book & Pay →' : 'Fee not listed yet'}</button>
      </div>
    `;
  }).join('');
}

function kindLabel(k){
  if (k === 'professional') return 'Doctor / Therapist';
  if (k === 'educator') return 'Educator / Tutor';
  if (k === 'agency') return 'Agency';
  return 'Caregiver';
}
function feeRangeLabel(p){
  if (!p.feeMin && !p.feeMax) return 'Fee not listed';
  if (p.feeMin && p.feeMax && p.feeMin !== p.feeMax) return `₹${p.feeMin} – ₹${p.feeMax}`;
  return `₹${p.feeMin || p.feeMax}`;
}

let requestedCaregiverName = null;

function openBookModal(p, caregiverName){
  selectedProvider = p;
  requestedCaregiverName = caregiverName || null;
  document.getElementById('bookModalName').textContent = caregiverName ? 'Book ' + caregiverName : 'Book ' + p.name;
  const metaBits = [p.typeLabel, [p.area,p.city].filter(Boolean).join(', ')].filter(Boolean);
  document.getElementById('bookModalMeta').textContent = (caregiverName ? 'via ' + p.name + (metaBits.length ? ' · ' + metaBits.join(' · ') : '') : metaBits.join(' · '));
  document.getElementById('bookAmountDisplay').textContent = '₹' + (p.feeMin || p.feeMax);
  document.getElementById('bookParentName').value = '';
  document.getElementById('bookParentPhone').value = '';
  document.getElementById('bookDate').value = '';
  document.getElementById('bookNotes').value = '';
  document.getElementById('bookStatusMsg').textContent = '';
  document.getElementById('bookFormArea').style.display = 'block';
  document.getElementById('bookSuccessArea').style.display = 'none';
  document.getElementById('bookModalBg').classList.add('active');
}
function closeBookModal(){
  document.getElementById('bookModalBg').classList.remove('active');
  selectedProvider = null;
  requestedCaregiverName = null;
}

function openRosterViewModal(agency){
  document.getElementById('rosterModalName').textContent = agency.name;
  const loc = [agency.area, agency.city, agency.state].filter(Boolean).join(', ');
  document.getElementById('rosterModalMeta').textContent = loc || '';
  const roster = agency.roster || [];
  const listEl = document.getElementById('rosterModalList');
  if (!roster.length){
    listEl.innerHTML = '<div class="empty-note">No caregivers listed yet.</div>';
  } else {
    listEl.innerHTML = roster.map(r => {
      const specChips = (r.specializations || []).map(s => `<span class="roster-chip">${escapeHtml(s)}</span>`).join('');
      const langText = (r.languages_spoken || []).join(', ');
      const expLabel = (r.years_experience || r.years_experience === 0) ? `${r.years_experience} yrs experience` : '';
      return `
        <div class="roster-item">
          <div class="rname">${escapeHtml(r.name)}</div>
          <div class="rmeta">${[expLabel, langText ? 'Speaks: ' + langText : ''].filter(Boolean).join(' · ')}</div>
          ${specChips ? `<div style="margin-bottom:6px">${specChips}</div>` : ''}
          ${r.bio ? `<div class="rbio">${escapeHtml(r.bio)}</div>` : ''}
          <button class="book-btn" ${agency.feeMin ? '' : 'disabled'} onclick='bookRosterCaregiver(${JSON.stringify(agency).replace(/'/g, "&#39;")}, ${JSON.stringify(r.name).replace(/'/g, "&#39;")})'>${agency.feeMin ? 'Book ' + escapeHtml(r.name) + ' →' : 'Fee not listed yet'}</button>
        </div>
      `;
    }).join('');
  }
  document.getElementById('rosterModalBg').classList.add('active');
}
function closeRosterViewModal(){
  document.getElementById('rosterModalBg').classList.remove('active');
}
function bookRosterCaregiver(agency, caregiverName){
  closeRosterViewModal();
  openBookModal(agency, caregiverName);
}

async function openReviewsModal(kind, providerId, name){
  document.getElementById('reviewsModalName').textContent = name;
  const listEl = document.getElementById('reviewsModalList');
  const metaEl = document.getElementById('reviewsModalMeta');
  metaEl.textContent = 'Loading…';
  listEl.innerHTML = '';
  document.getElementById('reviewsModalBg').classList.add('active');
  try{
    const { data, error } = await sb.from('ratings')
      .select('stars, review_text, created_at')
      .eq('provider_type', kind)
      .eq('provider_id', providerId)
      .order('created_at', { ascending: false });
    if (error || !data || !data.length){
      metaEl.textContent = '';
      listEl.innerHTML = '<div class="empty-note">No reviews yet.</div>';
      return;
    }
    const avg = data.reduce((s,r)=>s+r.stars,0) / data.length;
    metaEl.textContent = `★ ${avg.toFixed(1)} average · ${data.length} review${data.length===1?'':'s'}`;
    listEl.innerHTML = data.map(r => `
      <div class="roster-item">
        <div style="color:#ff8a5c;font-size:.95rem">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</div>
        ${r.review_text ? `<div class="rbio" style="margin-top:4px">"${escapeHtml(r.review_text)}"</div>` : ''}
        <div style="font-size:.72rem;color:#A8A29E;margin-top:4px">${new Date(r.created_at).toLocaleDateString('en-IN', { year:'numeric', month:'short' })}</div>
      </div>
    `).join('');
  }catch(err){
    console.error('Load reviews error:', err);
    metaEl.textContent = '';
    listEl.innerHTML = '<div class="empty-note">Something went wrong loading reviews.</div>';
  }
}
function closeReviewsModal(){
  document.getElementById('reviewsModalBg').classList.remove('active');
}

function openProviderProfile(p){
  const loc = [p.area, p.city, p.state].filter(Boolean).join(', ');
  const feeLabel = feeRangeLabel(p);
  const ratingKey = p.kind + ':' + p.providerId;
  const rs = ratingsSummary[ratingKey];
  const ratingLabel = rs ? `★ ${(rs.sum / rs.count).toFixed(1)} (${rs.count})` : 'No ratings yet';
  const ratingHtml = rs ? `<span style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted" onclick='openReviewsModal(${JSON.stringify(p.kind)}, ${JSON.stringify(p.providerId)}, ${JSON.stringify(p.name)})'>${escapeHtml(ratingLabel)}</span>` : escapeHtml(ratingLabel);
  const initial = (p.name || '?').trim().charAt(0).toUpperCase();
  const rosterCount = (p.roster || []).length;

  const actionHtml = p.kind === 'agency'
    ? `<button class="book-btn" ${rosterCount ? '' : 'disabled'} onclick='closeProviderProfile();openRosterViewModal(${JSON.stringify(p).replace(/'/g, "&#39;")})'>${rosterCount ? `View Caregivers (${rosterCount}) →` : 'No caregivers listed yet'}</button>`
    : `<button class="book-btn" ${p.feeMin ? '' : 'disabled'} onclick='closeProviderProfile();openBookModal(${JSON.stringify(p).replace(/'/g, "&#39;")})'>${p.feeMin ? 'Book & Pay →' : 'Fee not listed yet'}</button>`;

  document.getElementById('profileModalBody').innerHTML = `
    ${p.photoUrl ? `<img src="${escapeHtml(p.photoUrl)}" class="profile-photo-lg" alt="">` : `<div class="profile-avatar-placeholder">${escapeHtml(initial)}</div>`}
    <div class="type-tag" style="text-align:center;display:block">${escapeHtml(kindLabel(p.kind))}</div>
    <h3 style="text-align:center;margin-bottom:4px">${escapeHtml(p.name)}</h3>
    <div class="sub" style="text-align:center;margin-bottom:14px">${p.typeLabel ? escapeHtml(p.typeLabel) + ' · ' : ''}${loc ? escapeHtml(loc) + ' · ' : ''}${ratingHtml}</div>
    ${p.qualifications ? `<div style="font-size:.85rem;color:#57534E;margin-bottom:8px"><strong>Qualifications:</strong> ${escapeHtml(p.qualifications)}</div>` : ''}
    ${p.yearsExp ? `<div style="font-size:.85rem;color:#57534E;margin-bottom:8px"><strong>Experience:</strong> ${p.yearsExp} years</div>` : ''}
    ${p.languages && p.languages.length ? `<div style="font-size:.85rem;color:#57534E;margin-bottom:8px"><strong>Speaks:</strong> ${escapeHtml(p.languages.join(', '))}</div>` : ''}
    ${p.bio ? `<div class="bio" style="margin-top:10px">${escapeHtml(p.bio)}</div>` : ''}
    ${p.videoUrl ? renderVideoEmbed(p.videoUrl) : ''}
    <div class="fee" style="margin-top:12px">${feeLabel}</div>
    <div class="modal-actions" style="margin-top:16px;gap:10px">
      ${actionHtml}
      <button class="btn-cancel" style="flex:1" onclick="closeProviderProfile()">Close</button>
    </div>
  `;
  document.getElementById('profileModalBg').classList.add('active');
}

function closeProviderProfile(){
  document.getElementById('profileModalBg').classList.remove('active');
}

async function startPayment(){
  const statusEl = document.getElementById('bookStatusMsg');
  const btn = document.getElementById('payBtn');
  statusEl.textContent = '';
  btn.disabled = true; btn.textContent = 'Preparing payment…';

  try{
    const parentName = document.getElementById('bookParentName').value.trim();
    const parentPhone = document.getElementById('bookParentPhone').value.trim();
    if (!parentPhone) {
      statusEl.textContent = 'Please enter your phone number so the provider can reach you.';
      btn.disabled = false; btn.textContent = 'Pay & Book →';
      return;
    }
    const amount = selectedProvider.feeMin || selectedProvider.feeMax;
    const bookingDraft = {
      provider_type: selectedProvider.kind,
      provider_id: selectedProvider.providerId,
      provider_name: selectedProvider.name,
      amount: amount,
      preferred_date: document.getElementById('bookDate').value || null,
      notes: document.getElementById('bookNotes').value.trim() || null,
      parent_name: parentName || null,
      parent_phone: parentPhone,
      requested_caregiver_name: requestedCaregiverName || null,
    };

    const { data: { session } } = await sb.auth.getSession();
    const orderRes = await fetch(`${NS_URL}/functions/v1/create-booking-order`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
      body: JSON.stringify({ amount }),
    });
    const orderData = await orderRes.json();
    if (!orderRes.ok || !orderData.orderId) {
      statusEl.textContent = orderData.error || 'Could not start payment. Please try again.';
      btn.disabled = false; btn.textContent = 'Pay & Book →';
      return;
    }

    btn.textContent = 'Waiting for payment…';

    const rzp = new Razorpay({
      key: orderData.keyId,
      amount: orderData.amount,
      currency: 'INR',
      name: 'NeuroSarathi',
      description: 'Booking: ' + selectedProvider.name,
      order_id: orderData.orderId,
      handler: async function(response){
        btn.textContent = 'Confirming booking…';
        try{
          const verifyRes = await fetch(`${NS_URL}/functions/v1/verify-booking-payment`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
            body: JSON.stringify({
              razorpay_order_id: response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature: response.razorpay_signature,
              booking: bookingDraft,
            }),
          });
          const verifyData = await verifyRes.json();
          if (!verifyRes.ok || !verifyData.success) {
            statusEl.textContent = verifyData.error || 'Payment succeeded but booking could not be confirmed. Contact support with your payment ID: ' + response.razorpay_payment_id;
            btn.disabled = false; btn.textContent = 'Pay & Book →';
            return;
          }
          document.getElementById('bookFormArea').style.display = 'none';
          document.getElementById('bookSuccessArea').style.display = 'block';
        }catch(err){
          console.error('Verify error:', err);
          statusEl.textContent = 'Payment succeeded but something went wrong confirming it. Contact support with payment ID: ' + response.razorpay_payment_id;
          btn.disabled = false; btn.textContent = 'Pay & Book →';
        }
      },
      modal: {
        ondismiss: function(){
          btn.disabled = false; btn.textContent = 'Pay & Book →';
        }
      },
      theme: { color: '#ff8a5c' },
    });
    rzp.open();
  }catch(err){
    console.error('Start payment error:', err);
    statusEl.textContent = 'Something went wrong. Please try again.';
    btn.disabled = false; btn.textContent = 'Pay & Book →';
  }
}

function renderVideoEmbed(url){
  try{
    const ytMatch = url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    if(ytMatch){
      const videoId = ytMatch[1];
      return `<div style="margin:10px 0;border-radius:12px;overflow:hidden;aspect-ratio:16/9"><iframe width="100%" height="100%" src="https://www.youtube.com/embed/${videoId}" title="Introduction video" frameborder="0" allowfullscreen></iframe></div>`;
    }
    return `<div style="margin:10px 0"><a href="${escapeHtml(url)}" target="_blank" rel="noopener" style="font-size:.82rem;color:#ff8a5c;font-weight:700">▶ Watch introduction video</a></div>`;
  }catch(e){
    return '';
  }
}

function escapeHtml(s){
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function showView(view){
  document.getElementById('navFind').classList.toggle('active', view === 'find');
  document.getElementById('navBookings').classList.toggle('active', view === 'bookings');
  document.getElementById('findView').style.display = view === 'find' ? 'block' : 'none';
  document.getElementById('bookingsView').style.display = view === 'bookings' ? 'block' : 'none';
  if (view === 'bookings') loadMyBookings();
}

async function loadMyBookings(){
  const mount = document.getElementById('myBookingsListMount');
  try{
    const { data, error } = await sb.from('bookings')
      .select('id, provider_type, provider_id, provider_name, amount, preferred_date, notes, status, created_at, requested_caregiver_name')
      .eq('parent_user_id', currentUserId)
      .order('created_at', { ascending: false });
    if (error) { mount.innerHTML = `<div class="empty-note">Couldn't load your bookings.</div>`; return; }
    if (!data || !data.length) { mount.innerHTML = `<div class="empty-note">No bookings yet — find a provider above to get started.</div>`; return; }

    // fetch provider phone numbers + existing ratings in parallel
    const proIds = data.filter(b => b.provider_type === 'professional' || b.provider_type === 'educator').map(b => b.provider_id);
    const cgIds = data.filter(b => b.provider_type === 'caregiver').map(b => b.provider_id);
    const agcIds = data.filter(b => b.provider_type === 'agency').map(b => b.provider_id);
    const bookingIds = data.map(b => b.id);
    const [{ data: pros }, { data: cgs }, { data: agcs }, { data: ratings }] = await Promise.all([
      proIds.length ? sb.from('professionals').select('id, phone_number').in('id', proIds) : Promise.resolve({ data: [] }),
      cgIds.length ? sb.from('caregivers').select('user_id, phone_number').in('user_id', cgIds) : Promise.resolve({ data: [] }),
      agcIds.length ? sb.from('agencies').select('user_id, phone_number').in('user_id', agcIds) : Promise.resolve({ data: [] }),
      sb.from('ratings').select('booking_id, stars, review_text').in('booking_id', bookingIds),
    ]);
    const phoneByProId = {};
    (pros || []).forEach(p => phoneByProId[p.id] = p.phone_number);
    (cgs || []).forEach(c => phoneByProId[c.user_id] = c.phone_number);
    (agcs || []).forEach(a => phoneByProId[a.user_id] = a.phone_number);
    const ratingByBooking = {};
    (ratings || []).forEach(r => ratingByBooking[r.booking_id] = r);

    mount.innerHTML = data.map(b => {
      const phone = phoneByProId[b.provider_id];
      const existingRating = ratingByBooking[b.id];
      return `
      <div class="card">
        <div class="type-tag">${escapeHtml(kindLabel(b.provider_type))}</div>
        <div class="name">${escapeHtml(b.provider_name || 'Provider')}</div>
        ${b.requested_caregiver_name ? `<div style="font-size:.82rem;color:#9A3412;font-weight:700;margin-top:2px">Requested: ${escapeHtml(b.requested_caregiver_name)}</div>` : ''}
        <div class="meta">₹${escapeHtml(String(b.amount))}${b.preferred_date ? ' · ' + escapeHtml(b.preferred_date) : ''} · ${escapeHtml(b.status)}</div>
        ${(b.status === 'confirmed' || b.status === 'completed') && phone ? `<div style="font-size:.85rem;font-weight:700;color:#2a7b47;margin-bottom:10px">Provider contact: ${escapeHtml(phone)}</div>` : ''}
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${b.status === 'confirmed' ? `<button class="book-btn" onclick="markMeetingDone('${b.id}')">Mark Meeting Done</button>` : ''}
          ${b.status === 'completed' ? `<button class="book-btn" style="background:#F3F4F6;color:#0e1524" onclick="viewInvoice(${JSON.stringify(b).replace(/'/g, "&#39;")})">View Invoice</button>` : ''}
        </div>
        ${b.status === 'completed' ? renderRatingWidget(b.id, existingRating) : ''}
      </div>`;
    }).join('');
  }catch(err){
    console.error('Load my bookings error:', err);
    mount.innerHTML = `<div class="empty-note">Something went wrong loading your bookings.</div>`;
  }
}

async function markMeetingDone(bookingId){
  try{
    const { error } = await sb.from('bookings').update({ status: 'completed', updated_at: new Date().toISOString() }).eq('id', bookingId);
    if (error) { alert('Could not update: ' + error.message); return; }
    loadMyBookings();
  }catch(err){
    console.error('Mark meeting done error:', err);
    alert('Something went wrong.');
  }
}

function renderRatingWidget(bookingId, existingRating){
  if (existingRating) {
    const stars = existingRating.stars;
    return `<div style="margin-top:10px">
      <div style="font-size:.85rem;color:#7b8194">Your rating: ${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</div>
      ${existingRating.review_text ? `<div style="font-size:.82rem;color:#57534E;margin-top:4px;font-style:italic">"${escapeHtml(existingRating.review_text)}"</div>` : ''}
    </div>`;
  }
  const starSpans = [1,2,3,4,5].map(n => `<span class="rate-star" data-n="${n}" onclick="selectRatingStar('${bookingId}',${n})" style="cursor:pointer;font-size:1.3rem;color:#E5E7EB">★</span>`).join('');
  return `<div style="margin-top:10px" id="rateWidget-${bookingId}">
    <div style="font-size:.8rem;color:#7b8194;margin-bottom:4px">Rate this provider:</div>
    <div id="rateStars-${bookingId}">${starSpans}</div>
    <div id="rateExtra-${bookingId}" style="display:none;margin-top:8px">
      <textarea id="rateText-${bookingId}" rows="2" placeholder="Optional: share a few words about your experience" style="width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid #E5E7EB;font-family:inherit;font-size:.85rem;box-sizing:border-box;margin-bottom:8px"></textarea>
      <button class="book-btn" onclick="submitRating('${bookingId}')">Submit Review</button>
    </div>
  </div>`;
}

function selectRatingStar(bookingId, n){
  const container = document.getElementById('rateStars-' + bookingId);
  container.dataset.selected = n;
  container.querySelectorAll('.rate-star').forEach(s => {
    s.style.color = parseInt(s.dataset.n) <= n ? '#ff8a5c' : '#E5E7EB';
  });
  document.getElementById('rateExtra-' + bookingId).style.display = 'block';
}

async function submitRating(bookingId){
  try{
    const container = document.getElementById('rateStars-' + bookingId);
    const stars = parseInt(container?.dataset.selected || '0');
    if (!stars) { alert('Please select a star rating first.'); return; }
    const reviewText = document.getElementById('rateText-' + bookingId).value.trim();
    const { data: b } = await sb.from('bookings').select('provider_type, provider_id').eq('id', bookingId).maybeSingle();
    const { error } = await sb.from('ratings').insert({
      booking_id: bookingId,
      provider_type: b?.provider_type || null,
      provider_id: b?.provider_id || null,
      parent_user_id: currentUserId,
      stars: stars,
      review_text: reviewText || null,
    });
    if (error) { alert('Could not submit rating: ' + error.message); return; }
    loadMyBookings();
  }catch(err){
    console.error('Submit rating error:', err);
    alert('Could not submit rating.');
  }
}
