<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — NeuroSarathi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --background: oklch(0.983 0.012 85);
    --ink: oklch(0.22 0.035 265);
    --ink-soft: oklch(0.38 0.028 260);
    --card: oklch(0.985 0.008 80);
    --primary: oklch(0.5 0.1 165);
    --primary-foreground: oklch(0.983 0.012 85);
    --sage-soft: oklch(0.92 0.03 145);
    --terracotta: oklch(0.62 0.13 45);
    --muted-foreground: oklch(0.48 0.025 260);
    --border: oklch(0.88 0.02 70);
    --shadow-lift: 0 2px 4px oklch(0.22 0.035 265 / 0.05), 0 24px 60px -20px oklch(0.28 0.08 265 / 0.18);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:var(--background);color:var(--ink);
    background-image: radial-gradient(1000px 500px at 15% 0%, oklch(0.92 0.05 55 / .45), transparent 60%), radial-gradient(800px 500px at 100% 100%, oklch(0.9 0.04 145 / .3), transparent 60%);
  }
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 80px;}
  .disclaimer{background:oklch(0.93 0.05 45 / .5);border:1px solid var(--terracotta);color:oklch(0.4 0.13 45);
    font-size:13px;padding:10px 14px;border-radius:14px;margin-bottom:18px;line-height:1.4;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:28px;
    padding:28px 24px;margin-bottom:16px;box-shadow:var(--shadow-lift);}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:1.5rem;margin:0 0 4px;color:var(--ink);}
  h2{font-family:'Fraunces',serif;font-weight:500;font-size:1.15rem;margin:0 0 12px;color:var(--ink);}
  p{color:var(--ink-soft);font-size:.95rem;line-height:1.5;}
  label{display:block;font-size:.85rem;font-weight:600;margin:14px 0 6px;color:var(--ink);}
  input[type=text], input[type=number], select{
    width:100%;padding:13px 16px;border:1px solid var(--border);border-radius:14px;
    font-family:inherit;font-size:.95rem;background:var(--background);color:var(--ink);}
  input:focus, select:focus{outline:none;border-color:var(--terracotta);}
  .chip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .chip{border:1px solid var(--border);border-radius:999px;padding:8px 14px;
    font-size:.85rem;cursor:pointer;background:var(--background);user-select:none;color:var(--ink);}
  .chip.selected{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary);}
  .btn{display:inline-block;width:100%;text-align:center;background:var(--primary);
    color:var(--primary-foreground);border:none;padding:14px;border-radius:999px;
    font-weight:600;font-size:1rem;cursor:pointer;transition:transform .2s;
    box-shadow:var(--shadow-lift);margin-top:18px;font-family:inherit;}
  .btn:hover{transform:scale(1.01);}
  .btn.secondary{background:var(--background);color:var(--primary);border:1px solid var(--primary);box-shadow:none;}
  .btn.small{width:auto;padding:10px 18px;font-size:.85rem;margin-top:0;}
  .greeting{font-family:'Fraunces',serif;font-weight:500;font-size:1.6rem;margin-bottom:4px;color:var(--ink);}
  .sub{color:var(--ink-soft);font-size:.9rem;margin-bottom:0;}
  .row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .row .btn{margin-top:0;}
  .soon{opacity:0.6;}
  .soon-tag{display:inline-block;font-size:11px;background:var(--sage-soft);
    color:oklch(0.35 0.08 150);padding:3px 8px;border-radius:6px;margin-left:6px;}
  .loading{text-align:center;color:var(--ink-soft);padding:40px 0;}
  .error{color:oklch(0.4 0.15 25);font-size:.85rem;margin-top:8px;background:oklch(0.93 0.05 25);padding:10px 14px;border-radius:10px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .topbar a{color:var(--muted-foreground);font-size:.85rem;text-decoration:none;}
  .avatar-fab{position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;
    box-shadow:var(--shadow-lift);cursor:pointer;z-index:1000;
    border:2px solid var(--card);background:var(--primary);overflow:hidden;display:none;}
  .avatar-fab img{width:100%;height:100%;object-fit:cover;display:block;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <strong style="color:var(--primary);">NeuroSarathi</strong>
    <a href="#" id="signOutLink">Sign out</a>
  </div>

  <div class="disclaimer">
    NeuroSarathi provides educational ideas to support your child's everyday development.
    This is not medical, diagnostic, or therapeutic advice — always consult a qualified
    professional for concerns about your child's health or development.
  </div>

  <div id="app"><div class="loading">Loading your dashboard…</div></div>
</div>

<div class="avatar-fab" id="avatarFab" title="Talk to Sarathi Avatar">
  <img src="/sarathi-avatar.png" alt="Sarathi Avatar">
</div>

<script>
const SUPABASE_URL = "https://qvuenvngwgcknawfsnxl.supabase.co";
const SUPABASE_KEY = "sb_publishable_yxeYwwS9SIxxnavzwhGaxA_koX646U-";
const dash2Client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const SARATHI_CHAT_URL = SUPABASE_URL + "/functions/v1/sarathi-chat";

const GUIDED_QUESTIONS = [
  "What's a small thing your child did recently that made you smile or proud?",
  "Think of a moment yesterday or today that felt like a real struggle for your child — what was happening?",
  "Is there something your child does over and over, or gets really absorbed in?",
  "When your child is upset, what usually helps them feel better?"
];

const FOCUS_OPTIONS = [
  {key:"communication", label:"Communication"},
  {key:"routines", label:"Routines"},
  {key:"focus", label:"Focus"},
  {key:"social_play", label:"Social Play"},
  {key:"big_emotions", label:"Big Emotions"},
  {key:"school_readiness", label:"School Readiness"}
];

const app = document.getElementById("app");
let currentUser = null;
let currentChild = null;
let allChildren = [];

async function init(){
  const { data: { session } } = await dash2Client.auth.getSession();
  if(!session || !session.user){
    window.location.href = "/enterportal.html";
    return;
  }
  currentUser = session.user;
  await loadChildren();
}

async function loadChildren(selectId){
  app.innerHTML = '<div class="loading">Loading your dashboard…</div>';
  const { data, error } = await dash2Client
    .from("children")
    .select("*")
    .eq("parent_id", currentUser.id)
    .is("deleted_at", null)
    .order("created_at", { ascending: true });

  if(error){
    app.innerHTML = '<div class="card"><p class="error">Could not load your dashboard: '+error.message+'</p></div>';
    return;
  }

  allChildren = data || [];

  if(allChildren.length === 0){
    currentChild = null;
    renderAddChildForm();
  } else {
    if(selectId){
      currentChild = allChildren.find(c=>c.id===selectId) || allChildren[0];
    } else if(currentChild){
      currentChild = allChildren.find(c=>c.id===currentChild.id) || allChildren[0];
    } else {
      currentChild = allChildren[0];
    }
    renderFeed(currentChild);
  }
  updateAvatarFab();
}

function updateAvatarFab(){
  const fab = document.getElementById("avatarFab");
  if(!fab) return;
  fab.style.display = currentChild ? "block" : "none";
}

function renderAddChildForm(prefill){
  const p = prefill || {};
  const selected = new Set(p.focus_areas || []);
  app.innerHTML = `
    <div class="card">
      <h1>${p.id ? "Edit your child's info" : "Let's add your child"}</h1>
      <p>Just a few details so we can guide you with the right ideas each day.</p>

      <label for="cName">Child's name</label>
      <input type="text" id="cName" value="${p.display_name ? escapeHtml(p.display_name) : ""}" placeholder="e.g. Aarav">

      <label for="cAge">Age (years)</label>
      <input type="number" id="cAge" min="0" max="18" value="${p.age !== undefined && p.age !== null ? p.age : ""}" placeholder="e.g. 4">

      <label for="cGender">Gender (optional)</label>
      <select id="cGender">
        <option value="unknown" ${!p.biological_sex || p.biological_sex==='unknown' ? 'selected':''}>Prefer not to say</option>
        <option value="M" ${p.biological_sex==='M' ? 'selected':''}>Male</option>
        <option value="F" ${p.biological_sex==='F' ? 'selected':''}>Female</option>
        <option value="I" ${p.biological_sex==='I' ? 'selected':''}>Intersex</option>
      </select>

      <label>What would you like help nurturing?</label>
      <div class="chip-grid" id="focusGrid">
        ${FOCUS_OPTIONS.map(o => `<div class="chip ${selected.has(o.key)?'selected':''}" data-key="${o.key}">${o.label}</div>`).join("")}
      </div>

      <div id="formError" class="error"></div>
      <button class="btn" id="saveChildBtn">${p.id ? "Save changes" : "Add my child"}</button>
      ${(p.id || (allChildren.length > 0 && currentChild)) ? '<button class="btn secondary" id="cancelEditBtn">Cancel</button>' : ''}
    </div>
  `;

  document.querySelectorAll("#focusGrid .chip").forEach(chip=>{
    chip.addEventListener("click", ()=> chip.classList.toggle("selected"));
  });

  document.getElementById("saveChildBtn").addEventListener("click", ()=> saveChild(p.id));
  const cancelBtn = document.getElementById("cancelEditBtn");
  if(cancelBtn) cancelBtn.addEventListener("click", ()=> renderFeed(currentChild));
}

async function saveChild(existingId){
  const name = document.getElementById("cName").value.trim();
  const ageVal = document.getElementById("cAge").value;
  const gender = document.getElementById("cGender").value;
  const focus = Array.from(document.querySelectorAll("#focusGrid .chip.selected")).map(c=>c.dataset.key);
  const errEl = document.getElementById("formError");

  if(!name){
    errEl.textContent = "Please enter your child's name.";
    return;
  }

  const payload = {
    display_name: name,
    age: ageVal ? parseInt(ageVal, 10) : null,
    biological_sex: gender,
    focus_areas: focus
  };

  let result;
  if(existingId){
    result = await dash2Client.from("children").update(payload).eq("id", existingId).select();
  } else {
    payload.parent_id = currentUser.id;
    result = await dash2Client.from("children").insert(payload).select();
  }

  if(result.error){
    errEl.textContent = "Could not save: " + result.error.message;
    return;
  }

  await loadChildren(result.data[0].id);
}

function renderFeed(child){
  const focusLabels = (child.focus_areas || []).map(k=>{
    const found = FOCUS_OPTIONS.find(o=>o.key===k);
    return found ? found.label : k;
  });

  const switcherHtml = allChildren.length > 1 ? `
    <div class="chip-grid" id="childSwitcher" style="margin-bottom:16px;">
      ${allChildren.map(c => `<div class="chip ${c.id===child.id?'selected':''}" data-child-id="${c.id}">${escapeHtml(c.display_name)}</div>`).join("")}
      <div class="chip" id="addAnotherChip">+ Add child</div>
    </div>
  ` : `
    <div style="margin-bottom:16px;">
      <span class="chip" id="addAnotherChip">+ Add another child</span>
    </div>
  `;

  app.innerHTML = `
    ${switcherHtml}
    <div id="avatarBanner"></div>
    <div class="card">
      <div class="greeting">Hi! Here's ${escapeHtml(child.display_name)}'s day 🌱</div>
      <p class="sub">Enrolled since ${new Date(child.enrollment_date).toLocaleDateString()}</p>
      <div class="row" style="margin-top:14px;">
        <button class="btn secondary small" id="editChildBtn">Edit ${escapeHtml(child.display_name)}'s info</button>
        <button class="btn small" id="talkToSarathiBtn">💬 Talk to Sarathi Avatar</button>
      </div>
    </div>

    <div class="card">
      <h2>Today's gentle idea</h2>
      <p>${todaysSuggestion(focusLabels)}</p>
      ${(child.ai_focus_areas && child.ai_focus_areas.length) ? `
        <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);">
          <p style="font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px;">Sarathi Avatar's suggested focus areas</p>
          <div class="chip-grid">
            ${child.ai_focus_areas.map(a=>`<span class="chip selected" style="cursor:default;">${escapeHtml(a)}</span>`).join("")}
          </div>
        </div>
      ` : ''}
    </div>

    <div class="card" id="progressCard">
      <h2>Track progress</h2>
      <div class="row">
        <button class="btn small" id="addMilestoneBtn">+ Add milestone</button>
        <button class="btn small secondary" id="progressBtn">View progress</button>
      </div>
      <div id="progressPanel"></div>
    </div>

    <div class="card soon">
      <h2>Routine Builder <span class="soon-tag">Coming soon</span></h2>
      <p>Build a printable daily schedule tailored to ${escapeHtml(child.display_name)}.</p>
    </div>

    <div class="card soon">
      <h2>Activity Library <span class="soon-tag">Coming soon</span></h2>
      <p>Browse activities by age, interest, and time available.</p>
    </div>

    <div class="card soon">
      <h2>Find Professionals <span class="soon-tag">Coming soon</span></h2>
      <p>A directory of professionals near you.</p>
    </div>
  `;

  document.getElementById("editChildBtn").addEventListener("click", ()=> renderAddChildForm(child));
  document.getElementById("addMilestoneBtn").addEventListener("click", ()=> showMilestoneForm(child));
  document.getElementById("progressBtn").addEventListener("click", ()=> showProgress(child));
  document.getElementById("addAnotherChip").addEventListener("click", ()=> renderAddChildForm());
  document.getElementById("talkToSarathiBtn").addEventListener("click", ()=> startAvatarIntake(child));

  const switcher = document.getElementById("childSwitcher");
  if(switcher){
    switcher.querySelectorAll(".chip[data-child-id]").forEach(chip=>{
      chip.addEventListener("click", ()=>{
        const selected = allChildren.find(c=>c.id===chip.dataset.childId);
        if(selected){
          currentChild = selected;
          renderFeed(currentChild);
          updateAvatarFab();
        }
      });
    });
  }

  maybeShowAvatarBanner(child);
  updateAvatarFab();
}

function maybeShowAvatarBanner(child){
  const banner = document.getElementById("avatarBanner");
  if(!banner) return;
  const promptedKey = "ns_avatar_prompted_" + child.id;
  const alreadyPrompted = localStorage.getItem(promptedKey);
  const hasAiAreas = child.ai_focus_areas && child.ai_focus_areas.length > 0;

  if(alreadyPrompted || hasAiAreas){
    banner.innerHTML = "";
    return;
  }

  banner.innerHTML = `
    <div class="card" style="background:var(--sage-soft);border-color:var(--primary);">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
        <img src="/sarathi-avatar.png" alt="Sarathi Avatar" style="width:48px;height:48px;border-radius:50%;">
        <h2 style="margin:0;">Want a hand finding focus areas?</h2>
      </div>
      <p style="margin-bottom:0;">Sarathi Avatar can chat with you for a few minutes about ${escapeHtml(child.display_name)} and suggest some everyday focus areas.</p>
      <div class="row" style="margin-top:14px;">
        <button class="btn small" id="bannerYesBtn">Let's chat</button>
        <button class="btn small secondary" id="bannerLaterBtn">Maybe later</button>
      </div>
    </div>
  `;
  document.getElementById("bannerYesBtn").addEventListener("click", ()=>{
    localStorage.setItem(promptedKey, "1");
    startAvatarIntake(child);
  });
  document.getElementById("bannerLaterBtn").addEventListener("click", ()=>{
    localStorage.setItem(promptedKey, "1");
    banner.innerHTML = "";
  });
}

function focusLabel(key){
  const found = FOCUS_OPTIONS.find(o=>o.key===key);
  return found ? found.label : key;
}

function showMilestoneForm(child){
  const panel = document.getElementById("progressPanel");
  const today = new Date().toISOString().slice(0,10);
  panel.innerHTML = `
    <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border);">
      <label for="mFocus">Focus area</label>
      <select id="mFocus">
        ${FOCUS_OPTIONS.map(o=>`<option value="${o.key}">${o.label}</option>`).join("")}
      </select>

      <label for="mNote">What happened?</label>
      <input type="text" id="mNote" placeholder="e.g. Said a full sentence unprompted">

      <label for="mDate">Date</label>
      <input type="text" id="mDate" value="${today}" placeholder="YYYY-MM-DD">

      <div id="mError" class="error"></div>
      <button class="btn small" id="saveMilestoneBtn" style="margin-top:12px;">Save milestone</button>
    </div>
  `;
  document.getElementById("saveMilestoneBtn").addEventListener("click", ()=> saveMilestone(child));
}

async function saveMilestone(child){
  const focus_area = document.getElementById("mFocus").value;
  const note = document.getElementById("mNote").value.trim();
  const milestone_date = document.getElementById("mDate").value.trim();
  const errEl = document.getElementById("mError");

  if(!note){
    errEl.textContent = "Please add a short note about what happened.";
    return;
  }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(milestone_date)){
    errEl.textContent = "Please enter the date as YYYY-MM-DD.";
    return;
  }

  const { error } = await dash2Client.from("child_milestones").insert({
    child_id: child.id,
    focus_area,
    note,
    milestone_date
  });

  if(error){
    errEl.textContent = "Could not save: " + error.message;
    return;
  }

  document.getElementById("progressPanel").innerHTML =
    '<p style="margin-top:14px;color:var(--primary);">✓ Milestone saved.</p>';
}

async function showProgress(child){
  const panel = document.getElementById("progressPanel");
  panel.innerHTML = '<p style="margin-top:14px;">Loading…</p>';

  const { data, error } = await dash2Client
    .from("child_milestones")
    .select("*")
    .eq("child_id", child.id)
    .order("milestone_date", { ascending: false });

  if(error){
    panel.innerHTML = '<p class="error" style="margin-top:14px;">Could not load progress: '+error.message+'</p>';
    return;
  }

  if(!data || data.length === 0){
    panel.innerHTML = '<p style="margin-top:14px;color:var(--ink-soft);">No milestones logged yet for '+escapeHtml(child.display_name)+'. Add the first one above!</p>';
    return;
  }

  const items = data.map(m => `
    <div style="padding:10px 0;border-bottom:1px solid var(--border);">
      <div style="font-size:13px;font-weight:600;color:var(--primary);">${focusLabel(m.focus_area)}</div>
      <div style="font-size:14px;margin:2px 0;">${escapeHtml(m.note)}</div>
      <div style="font-size:12px;color:var(--ink-soft);">${new Date(m.milestone_date).toLocaleDateString()}</div>
    </div>
  `).join("");

  panel.innerHTML = `
    <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border);">
      <p style="color:var(--ink);font-weight:600;margin-bottom:8px;">${data.length} milestone${data.length===1?'':'s'} since enrolment</p>
      ${items}
    </div>
  `;
}

function todaysSuggestion(focusLabels){
  if(focusLabels.length === 0){
    return "Try a few minutes of calm, focused play together today — following your child's lead.";
  }
  const area = focusLabels[Math.floor(Math.random()*focusLabels.length)];
  const ideas = {
    "Communication":"Narrate what you're doing during a routine task — it gives your child gentle, low-pressure language exposure.",
    "Routines":"Use a simple visual cue (like a picture card) before transitioning to the next activity today.",
    "Focus":"Try a short, single-step task with a clear start and end — celebrate the finish, however small.",
    "Social Play":"Sit alongside your child during play and imitate what they're doing, without directing it.",
    "Big Emotions":"Name the feeling you notice ('That looked frustrating') before offering any solution.",
    "School Readiness":"Practice one small self-help step today, like packing a bag or putting on shoes."
  };
  return ideas[area] || "Spend a few unhurried minutes together today, following your child's lead.";
}

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

// ─── Avatar Intake (Phase 2) ───

let avatarState = null;

function startAvatarIntake(child){
  avatarState = {
    child,
    messages: [],
    guidedIndex: 0
  };
  const fab = document.getElementById("avatarFab");
  if(fab) fab.style.display = "none";
  renderAvatarGuidedQuestion();
}

function renderAvatarGuidedQuestion(){
  const { child, guidedIndex } = avatarState;
  const question = GUIDED_QUESTIONS[guidedIndex];

  app.innerHTML = `
    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
        <img src="/sarathi-avatar.png" alt="Sarathi Avatar" style="width:44px;height:44px;border-radius:50%;">
        <h1 style="margin:0;">Getting to know ${escapeHtml(child.display_name)}</h1>
      </div>
      <p>A few quick questions, then Sarathi Avatar will chat with you a bit more.</p>
      <div style="margin-top:16px;padding:14px;background:var(--sage-soft);border-radius:12px;">
        <p style="color:var(--ink);margin:0;">${escapeHtml(question)}</p>
      </div>
      <label for="guidedAnswer">Your answer</label>
      <input type="text" id="guidedAnswer" placeholder="Type your answer...">
      <div id="avatarError" class="error"></div>
      <button class="btn" id="guidedNextBtn">Next</button>
      <button class="btn secondary" id="avatarCancelBtn">Cancel</button>
    </div>
  `;

  document.getElementById("guidedNextBtn").addEventListener("click", handleGuidedAnswer);
  document.getElementById("avatarCancelBtn").addEventListener("click", ()=> renderFeed(currentChild));
}

function handleGuidedAnswer(){
  const input = document.getElementById("guidedAnswer");
  const answer = input.value.trim();
  const errEl = document.getElementById("avatarError");

  if(!answer){
    errEl.textContent = "Please share a short answer before continuing.";
    return;
  }

  avatarState.messages.push({ role: "assistant", content: GUIDED_QUESTIONS[avatarState.guidedIndex] });
  avatarState.messages.push({ role: "user", content: answer });
  avatarState.guidedIndex++;

  if(avatarState.guidedIndex < GUIDED_QUESTIONS.length){
    renderAvatarGuidedQuestion();
  } else {
    fetchAvatarReply();
  }
}

async function fetchAvatarReply(finalize){
  app.innerHTML = `
    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
        <img src="/sarathi-avatar.png" alt="Sarathi Avatar" style="width:44px;height:44px;border-radius:50%;">
        <h1 style="margin:0;">Chatting with Sarathi Avatar</h1>
      </div>
      <div class="loading">Sarathi Avatar is thinking…</div>
    </div>
  `;

  const { data: { session } } = await dash2Client.auth.getSession();
  if(!session){
    window.location.href = "/enterportal.html";
    return;
  }

  try {
    const resp = await fetch(SARATHI_CHAT_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + session.access_token
      },
      body: JSON.stringify({
        mode: "avatar_intake",
        childId: avatarState.child.id,
        messages: avatarState.messages,
        finalize: !!finalize
      })
    });

    const data = await resp.json();
    if(!resp.ok){
      throw new Error(data.error || "Something went wrong talking to Sarathi.");
    }

    if(finalize){
      handleFinalizeReply(data.reply);
    } else {
      avatarState.messages.push({ role: "assistant", content: data.reply });
      renderAvatarChatTurn();
    }
  } catch(err){
    app.innerHTML = `
      <div class="card">
        <h1>Something went wrong</h1>
        <p class="error">${escapeHtml(err.message)}</p>
        <button class="btn secondary" id="avatarBackBtn">Back to dashboard</button>
      </div>
    `;
    document.getElementById("avatarBackBtn").addEventListener("click", ()=> renderFeed(currentChild));
  }
}

function renderAvatarChatTurn(){
  const { child, messages } = avatarState;
  const lastAssistant = [...messages].reverse().find(m=>m.role==="assistant");

  const historyHtml = messages.map(m => `
    <div style="margin-bottom:10px;">
      <div style="font-size:12px;font-weight:600;color:${m.role==='assistant' ? 'var(--primary)' : 'var(--ink-soft)'};margin-bottom:2px;">
        ${m.role === 'assistant' ? 'Sarathi Avatar' : 'You'}
      </div>
      <div style="font-size:14px;color:var(--ink);">${escapeHtml(m.content)}</div>
    </div>
  `).join("");

  app.innerHTML = `
    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
        <img src="/sarathi-avatar.png" alt="Sarathi Avatar" style="width:44px;height:44px;border-radius:50%;">
        <h1 style="margin:0;">Chatting about ${escapeHtml(child.display_name)}</h1>
      </div>
      <div style="max-height:280px;overflow-y:auto;margin-bottom:12px;">${historyHtml}</div>
      <label for="chatReply">Your reply</label>
      <input type="text" id="chatReply" placeholder="Type your reply...">
      <div id="avatarError" class="error"></div>
      <button class="btn" id="chatSendBtn">Send</button>
      <button class="btn secondary" id="chatFinalizeBtn">I'm done — show suggestions</button>
      <button class="btn secondary" id="avatarCancelBtn">Cancel</button>
    </div>
  `;

  document.getElementById("chatSendBtn").addEventListener("click", ()=>{
    const input = document.getElementById("chatReply");
    const val = input.value.trim();
    const errEl = document.getElementById("avatarError");
    if(!val){
      errEl.textContent = "Please type a reply first.";
      return;
    }
    avatarState.messages.push({ role: "user", content: val });
    fetchAvatarReply(false);
  });

  document.getElementById("chatFinalizeBtn").addEventListener("click", ()=> fetchAvatarReply(true));
  document.getElementById("avatarCancelBtn").addEventListener("click", ()=> renderFeed(currentChild));
}

function handleFinalizeReply(rawReply){
  let parsed;
  try {
    const cleaned = rawReply.trim().replace(/^```json/i, "").replace(/^```/, "").replace(/```$/, "").trim();
    parsed = JSON.parse(cleaned);
  } catch(e){
    app.innerHTML = `
      <div class="card">
        <h1>Hmm, that didn't parse</h1>
        <p>Sarathi Avatar's response wasn't in the expected format. You can try finalizing again.</p>
        <button class="btn" id="retryFinalizeBtn">Try again</button>
        <button class="btn secondary" id="avatarCancelBtn">Back to dashboard</button>
      </div>
    `;
    document.getElementById("retryFinalizeBtn").addEventListener("click", ()=> fetchAvatarReply(true));
    document.getElementById("avatarCancelBtn").addEventListener("click", ()=> renderFeed(currentChild));
    return;
  }

  const suggestions = (parsed.suggestions || []).map(s => ({ ...s, approved: true }));
  avatarState.suggestions = suggestions;
  renderSuggestionApproval();
}

function renderSuggestionApproval(){
  const { child, suggestions } = avatarState;

  app.innerHTML = `
    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
        <img src="/sarathi-avatar.png" alt="Sarathi Avatar" style="width:44px;height:44px;border-radius:50%;">
        <h1 style="margin:0;">Suggested focus areas for ${escapeHtml(child.display_name)}</h1>
      </div>
      <p>Based on your conversation, Sarathi Avatar suggests these. Tap any to remove it — only the ones you approve will be saved.</p>
      <div class="chip-grid" id="suggestionGrid" style="margin-top:14px;">
        ${suggestions.map((s,i) => `
          <div class="chip ${s.approved ? 'selected' : ''}" data-idx="${i}" title="${escapeHtml(s.reason||'')}">${escapeHtml(s.label)}</div>
        `).join("")}
      </div>
      <div id="avatarError" class="error"></div>
      <button class="btn" id="saveSuggestionsBtn">Save approved areas</button>
      <button class="btn secondary" id="avatarCancelBtn">Cancel</button>
    </div>
  `;

  document.querySelectorAll("#suggestionGrid .chip").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      const idx = parseInt(chip.dataset.idx, 10);
      avatarState.suggestions[idx].approved = !avatarState.suggestions[idx].approved;
      chip.classList.toggle("selected");
    });
  });

  document.getElementById("saveSuggestionsBtn").addEventListener("click", saveApprovedSuggestions);
  document.getElementById("avatarCancelBtn").addEventListener("click", ()=> renderFeed(currentChild));
}

async function saveApprovedSuggestions(){
  const { child, suggestions } = avatarState;
  const approvedLabels = suggestions.filter(s=>s.approved).map(s=>s.label);
  const errEl = document.getElementById("avatarError");

  const { error } = await dash2Client
    .from("children")
    .update({ ai_focus_areas: approvedLabels })
    .eq("id", child.id);

  if(error){
    errEl.textContent = "Could not save: " + error.message;
    return;
  }

  avatarState = null;
  await loadChildren(child.id);
}

document.getElementById("avatarFab").addEventListener("click", ()=>{
  if(currentChild) startAvatarIntake(currentChild);
});

document.getElementById("signOutLink").addEventListener("click", async (e)=>{
  e.preventDefault();
  await dash2Client.auth.signOut();
  window.location.href = "/enterportal.html";
});

init();
</script>
</body>
</html>
