<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Therapist Dashboard — NeuroSarathi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #fafafa;
            color: #333;
        }
        header {
            background: linear-gradient(135deg, #1f656f 0%, #34a0a4 100%);
            color: white;
            padding: 20px 0;
        }
        header h1 { margin: 0; font-size: 28px; }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin: 30px 0;
        }
        .metric-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .metric-card h3 {
            font-size: 32px;
            color: #FF6B35;
            margin-bottom: 8px;
        }
        .metric-card p {
            color: #666;
            font-size: 14px;
        }
        .sections-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        .dashboard-section {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .dashboard-section h2 {
            color: #1f656f;
            margin-bottom: 16px;
            font-size: 20px;
        }
        .sessions-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .session-item {
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
            border-left: 4px solid #FF6B35;
        }
        .session-date {
            font-weight: 600;
            color: #1f656f;
        }
        .session-child {
            font-size: 14px;
            color: #333;
            margin: 4px 0;
        }
        .session-type {
            font-size: 12px;
            color: #666;
        }
        .session-location {
            font-size: 12px;
            margin: 8px 0;
        }
        .btn-small {
            background: #FF6B35;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 8px;
        }
        .btn-small:hover {
            background: #e55a24;
        }
        .children-progress {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }
        .child-progress-card {
            background: #f5f5f5;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }
        .child-progress-card h3 {
            margin-bottom: 12px;
            color: #1f656f;
        }
        @media (max-width: 768px) {
            .sections-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Therapist Dashboard</h1>
            <p>Manage your cases and sessions</p>
        </div>
    </header>

    <div class="container">
        <div id="dashboard"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/modules/therapist-dashboard.js"></script>
    <script>
        const supabase = window.supabaseClient;

        async function init() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                window.location.href = '/enterportal.html';
                return;
            }

            // Initialize dashboard if needed
            await TherapistDashboard.loadDashboard(user.id);
            
            // Render dashboard
            await TherapistDashboard.renderDashboard(user.id, 'dashboard');
            
            // Refresh metrics
            await TherapistDashboard.updateDashboard(user.id);
        }

        init();
    </script>
</body>
</html>
