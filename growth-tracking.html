<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growth Tracking — NeuroSarathi</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.0.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #fafafa;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            background: linear-gradient(135deg, #1f656f 0%, #34a0a4 100%);
            color: white;
            padding: 20px 0;
            margin-bottom: 30px;
        }
        header h1 {
            margin: 0;
            font-size: 28px;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .btn-primary {
            background: #FF6B35;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .btn-primary:hover {
            background: #e55a24;
        }
        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .card h2 {
            margin-bottom: 16px;
            font-size: 20px;
            color: #1f656f;
        }
        #growthChart {
            max-height: 400px;
        }
        .domain-list {
            list-style: none;
        }
        .domain-item {
            padding: 12px;
            margin-bottom: 8px;
            background: #f5f5f5;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .domain-item strong {
            color: #1f656f;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FF6B35, #FFB703);
            transition: width 0.3s;
        }
        .measurements-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        .measurements-table th,
        .measurements-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        .measurements-table th {
            background: #f5f5f5;
            font-weight: 600;
            color: #1f656f;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 32px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Growth Tracking</h1>
            <p>Monitor your child's developmental progress</p>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h2>Progress Over Time</h2>
            <button class="btn-primary" onclick="showAddModal()">+ Add Measurement</button>
        </div>

        <div class="content-grid">
            <div class="card">
                <h2>Development Graph</h2>
                <canvas id="growthChart"></canvas>
            </div>
            <div class="card">
                <h2>Quick Overview</h2>
                <ul class="domain-list" id="domainList"></ul>
            </div>
        </div>

        <div class="card">
            <h2>Recent Measurements</h2>
            <table class="measurements-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Domain</th>
                        <th>Measurement</th>
                        <th>Confidence</th>
                    </tr>
                </thead>
                <tbody id="measurementsBody"></tbody>
            </table>
        </div>
    </div>

    <div id="modal" class="modal"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabase = window.supabaseClient;
        
        async function init() {
            const childId = new URLSearchParams(window.location.search).get('id');
            if (!childId) {
                alert('Child ID not provided');
                return;
            }

            await loadDomainOverview(childId);
            await loadMeasurements(childId);
            await initGrowthCharts(childId);
        }

        async function loadDomainOverview(childId) {
            const domains = GrowthTracking.domains;
            const domainList = document.getElementById('domainList');
            
            for (const domain of domains) {
                const latest = await GrowthTracking.getLatestMeasurement(childId, domain);
                const progressRate = await GrowthTracking.calculateProgressRate(childId, domain);
                
                const item = document.createElement('li');
                item.className = 'domain-item';
                item.innerHTML = `
                    <div>
                        <strong>${domain.replace(/_/g, ' ')}</strong>
                        ${latest ? `<div>Latest: ${latest.measurement_value} ${latest.measurement_unit}</div>` : '<div>No data yet</div>'}
                        ${progressRate ? `<div style="font-size: 12px; color: #666;">+${progressRate.toFixed(2)}/month</div>` : ''}
                    </div>
                `;
                domainList.appendChild(item);
            }
        }

        async function loadMeasurements(childId) {
            const data = await GrowthTracking.loadGrowthData(childId);
            const tbody = document.getElementById('measurementsBody');
            
            data.reverse().slice(0, 10).forEach(m => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${m.measurement_date}</td>
                    <td>${m.domain.replace(/_/g, ' ')}</td>
                    <td>${m.measurement_value} ${m.measurement_unit}</td>
                    <td>${m.confidence_level}/10</td>
                `;
            });
        }

        function showAddModal() {
            const childId = new URLSearchParams(window.location.search).get('id');
            const { data: { user } } = supabase.auth.getUser().then(res => res);
            GrowthTracking.showAddModal(childId, user.id);
        }

        function showModal(html) {
            document.getElementById('modal').innerHTML = html;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // Load module
        const script = document.createElement('script');
        script.src = './js/modules/growth-tracking.js';
        document.head.appendChild(script);

        init();
    </script>
</body>
</html>
