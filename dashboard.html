<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — NeuroSarathi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --background: oklch(0.983 0.012 85);
    --ink: oklch(0.22 0.035 265);
    --ink-soft: oklch(0.38 0.028 260);
    --card: oklch(0.985 0.008 80);
    --primary: oklch(0.5 0.1 165);
    --primary-dark: oklch(0.4 0.1 165);
    --primary-foreground: oklch(0.983 0.012 85);
    --sage-soft: oklch(0.92 0.03 145);
    --terracotta: oklch(0.62 0.13 45);
    --gold: oklch(0.78 0.13 85);
    --muted-foreground: oklch(0.48 0.025 260);
    --border: oklch(0.88 0.02 70);
    --shadow-lift: 0 2px 4px oklch(0.22 0.035 265 / 0.05), 0 24px 60px -20px oklch(0.28 0.08 265 / 0.18);
    --shadow-soft: 0 1px 2px oklch(0.22 0.035 265 / 0.04), 0 8px 24px -12px oklch(0.28 0.08 265 / 0.12);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:var(--background);color:var(--ink);
    background-image: radial-gradient(1000px 500px at 15% 0%, oklch(0.92 0.05 55 / .4), transparent 60%), radial-gradient(800px 500px at 100% 20%, oklch(0.9 0.04 145 / .3), transparent 60%);
    background-attachment:fixed;
    position:relative;
    overflow-x:hidden;
  }

  /* Floating decorative texture, ambient not distracting */
  .bg-blob{position:fixed;border-radius:50%;filter:blur(50px);opacity:.35;z-index:0;pointer-events:none;}
  .bg-blob-1{width:260px;height:260px;top:-60px;right:-80px;background:var(--sage-soft);
    animation:driftSlow 18s ease-in-out infinite;}
  .bg-blob-2{width:200px;height:200px;bottom:10%;left:-90px;background:oklch(0.9 0.06 45 / .5);
    animation:driftSlow 22s ease-in-out infinite reverse;}
  @keyframes driftSlow{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(20px,-24px);}
  }

  .wrap{max-width:640px;margin:0 auto;padding:0 16px 90px;position:relative;z-index:1;}

  /* Sticky top bar */
  .topbar{position:sticky;top:0;z-index:900;display:flex;justify-content:space-between;align-items:center;
    padding:16px 4px;margin-bottom:4px;backdrop-filter:blur(14px);
    background:oklch(0.983 0.012 85 / 0.85);border-bottom:1px solid oklch(0.88 0.02 70 / .6);}
  .topbar .brand{display:flex;align-items:center;gap:8px;font-family:'Fraunces',serif;font-weight:600;font-size:1.05rem;color:var(--primary-dark);}
  .topbar .brand-dot{width:8px;height:8px;border-radius:50%;background:var(--terracotta);}
  .topbar a{color:var(--muted-foreground);font-size:.8rem;text-decoration:none;font-weight:600;}

  .disclaimer{background:oklch(0.93 0.05 45 / .5);border:1px solid var(--terracotta);color:oklch(0.4 0.13 45);
    font-size:12.5px;padding:10px 14px;border-radius:14px;margin:14px 0 18px;line-height:1.4;}

  /* Card entrance choreography */
  @keyframes cardIn{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }
  .story-row, .hero-cover, .card{animation:cardIn .5s cubic-bezier(.2,.7,.3,1) both;}
  .story-row{animation-delay:.02s;}
  .hero-cover{animation-delay:.08s;}
  .card:nth-of-type(1){animation-delay:.14s;}
  .card:nth-of-type(2){animation-delay:.2s;}
  .card:nth-of-type(3){animation-delay:.26s;}
  .card:nth-of-type(4){animation-delay:.32s;}
  .card:nth-of-type(5){animation-delay:.38s;}
  .card:nth-of-type(6){animation-delay:.44s;}

  /* Story-ring child switcher */
  .story-row{display:flex;gap:14px;overflow-x:auto;padding:6px 2px 18px;scrollbar-width:none;}
  .story-row::-webkit-scrollbar{display:none;}
  .story-item{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;cursor:pointer;}
  .story-ring{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg, var(--border), var(--border));padding:3px;transition:transform .15s;}
  .story-item.active .story-ring{background:linear-gradient(135deg, var(--terracotta), var(--gold), var(--primary));}
  .story-item:active .story-ring{transform:scale(0.94);}
  .story-avatar{width:100%;height:100%;border-radius:50%;background:var(--card);
    display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;
    font-weight:600;font-size:1.2rem;color:var(--primary-dark);border:2px solid var(--background);}
  .story-item .story-label{font-size:11.5px;color:var(--ink-soft);max-width:64px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
  .story-add .story-ring{background:none;border:2px dashed var(--border);}
  .story-add .story-avatar{background:var(--background);color:var(--muted-foreground);font-size:1.5rem;border:none;}

  /* Hero cover card */
  .hero-cover{position:relative;border-radius:28px;overflow:hidden;margin-bottom:16px;
    background:linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    box-shadow:var(--shadow-lift);padding:24px 22px;color:var(--primary-foreground);}
  .hero-cover::before{content:'';position:absolute;inset:0;
    background:radial-gradient(500px 260px at 100% 0%, oklch(1 0 0 / .12), transparent 60%);}
  .hero-cover::after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;
    background:oklch(1 0 0 / .06);right:-60px;bottom:-70px;}
  .hero-cover-inner{position:relative;display:flex;align-items:center;gap:16px;justify-content:space-between;}
  .hero-text{flex:1;min-width:0;}
  .hero-photo{width:84px;height:84px;border-radius:22px;flex-shrink:0;overflow:hidden;
    border:3px solid oklch(1 0 0 / .35);box-shadow:0 6px 18px oklch(0.22 0.035 265 / .3);
    background-size:cover;background-position:center;background-color:oklch(1 0 0 / .12);}
  .hero-eyebrow{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
    opacity:.75;font-weight:700;margin-bottom:6px;}
  .hero-greeting{font-family:'Fraunces',serif;font-weight:500;font-size:1.5rem;
    margin:0 0 4px;line-height:1.2;}
  .hero-wave{display:inline-block;animation:wave 2.2s ease-in-out infinite;transform-origin:70% 70%;}
  @keyframes wave{
    0%,60%,100%{transform:rotate(0deg);}
    10%{transform:rotate(14deg);} 20%{transform:rotate(-8deg);}
    30%{transform:rotate(14deg);} 40%{transform:rotate(-4deg);}
  }
  .hero-sub{opacity:.85;font-size:.85rem;margin:0;}
  .hero-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .hero-btn{background:oklch(1 0 0 / .18);color:#fff;border:1px solid oklch(1 0 0 / .3);
    padding:9px 16px;border-radius:999px;font-size:.8rem;font-weight:600;cursor:pointer;
    backdrop-filter:blur(6px);transition:transform .15s;white-space:nowrap;}
  .hero-btn:active{transform:scale(0.96);}
  @media (max-width:400px){
    .hero-photo{width:64px;height:64px;border-radius:16px;}
    .hero-greeting{font-size:1.3rem;}
  }

  /* Content cards */
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:16px;margin-bottom:14px;box-shadow:var(--shadow-soft);transition:box-shadow .2s;}
  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .card-icon{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;
    justify-content:center;font-size:16px;flex-shrink:0;background:var(--sage-soft);}
  .card-icon.terracotta{background:oklch(0.93 0.06 45);}
  .card-icon.gold{background:oklch(0.94 0.06 85);}

  /* Facebook-style post header: avatar + name + timestamp */
  .post-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .post-avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;overflow:hidden;
    background:var(--primary);display:flex;align-items:center;justify-content:center;
    color:var(--primary-foreground);font-family:'Fraunces',serif;font-weight:600;font-size:1rem;
    background-size:cover;background-position:center;}
  .post-meta{flex:1;min-width:0;}
  .post-name{font-weight:700;font-size:.92rem;color:var(--ink);line-height:1.25;
    display:flex;align-items:center;gap:5px;}
  .post-time{font-size:.75rem;color:var(--muted-foreground);display:flex;align-items:center;gap:4px;}
  .post-time-dot::before{content:'·';margin:0 1px;}
  .post-badge{font-size:14px;flex-shrink:0;}

  /* Composer bar */
  .composer{background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow-soft);
    display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .15s;}
  .composer:active{background:var(--background);}
  .composer-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;
    background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;
    justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:.9rem;
    background-size:cover;background-position:center;}
  .composer-input{flex:1;background:var(--background);border:1px solid var(--border);
    border-radius:999px;padding:10px 16px;color:var(--muted-foreground);font-size:.88rem;}

  /* Bottom action row like a Facebook post */
  .post-actions{display:flex;border-top:1px solid var(--border);margin-top:12px;padding-top:6px;}
  .post-action-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    background:none;border:none;padding:9px 4px;border-radius:8px;cursor:pointer;
    color:var(--muted-foreground);font-size:.82rem;font-weight:600;font-family:inherit;
    transition:background .15s;}
  .post-action-btn:active{background:var(--background);}
  .post-action-btn.active-like{color:var(--primary);}

  h1{font-family:'Fraunces',serif;font-weight:500;font-size:1.4rem;margin:0 0 4px;color:var(--ink);}
  h2{font-family:'Fraunces',serif;font-weight:500;font-size:1.08rem;margin:0;color:var(--ink);}
  p{color:var(--ink-soft);font-size:.92rem;line-height:1.55;}
  label{display:block;font-size:.83rem;font-weight:600;margin:14px 0 6px;color:var(--ink);}
  input[type=text], input[type=number], select{
    width:100%;padding:13px 16px;border:1px solid var(--border);border-radius:14px;
    font-family:inherit;font-size:.95rem;background:var(--background);color:var(--ink);}
  input:focus, select:focus{outline:none;border-color:var(--terracotta);}
  .chip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .chip{border:1px solid var(--border);border-radius:999px;padding:8px 14px;
    font-size:.85rem;cursor:pointer;background:var(--background);user-select:none;color:var(--ink);
    transition:transform .1s;}
  .chip:active{transform:scale(0.96);}
  .chip.selected{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary);}
  .btn{display:inline-block;width:100%;text-align:center;background:var(--primary);
    color:var(--primary-foreground);border:none;padding:14px;border-radius:999px;
    font-weight:600;font-size:1rem;cursor:pointer;transition:transform .15s;
    box-shadow:var(--shadow-soft);margin-top:18px;font-family:inherit;}
  .btn:active{transform:scale(0.98);}
  .btn.secondary{background:var(--background);color:var(--primary);border:1px solid var(--primary);box-shadow:none;}
  .btn.small{width:auto;padding:10px 18px;font-size:.85rem;margin-top:0;}
  .row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .row .btn{margin-top:0;}
  .soon{opacity:0.65;}
  .soon-tag{display:inline-block;font-size:10.5px;background:var(--sage-soft);
    color:oklch(0.35 0.08 150);padding:3px 8px;border-radius:6px;margin-left:6px;font-weight:700;
    letter-spacing:.02em;text-transform:uppercase;}
  .loading{text-align:center;color:var(--ink-soft);padding:40px 0;}
  .error{color:oklch(0.4 0.15 25);font-size:.85rem;margin-top:8px;background:oklch(0.93 0.05 25);padding:10px 14px;border-radius:10px;}

  /* Empty state illustration */
  .empty-illustration{width:96px;height:96px;border-radius:50%;margin:0 auto 16px;display:block;
    box-shadow:var(--shadow-soft);animation:floatGentle 3.4s ease-in-out infinite;}
  @keyframes floatGentle{
    0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);}
  }

  /* Celebratory success feedback */
  .success-pop{animation:popIn .4s cubic-bezier(.2,.8,.3,1.4);}
  @keyframes popIn{
    0%{opacity:0;transform:scale(.85);}
    60%{transform:scale(1.03);}
    100%{opacity:1;transform:scale(1);}
  }

  /* Milestone timeline */
  .timeline{position:relative;padding-left:20px;margin-top:6px;}
  .timeline::before{content:'';position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--border);}
  .timeline-item{position:relative;padding-bottom:16px;animation:cardIn .35s ease both;}
  .timeline-item:last-child{padding-bottom:0;}
  .timeline-dot{position:absolute;left:-20px;top:3px;width:12px;height:12px;border-radius:50%;
    background:var(--primary);border:2px solid var(--card);box-shadow:0 0 0 2px var(--primary);}
  .timeline-tag{font-size:11.5px;font-weight:700;color:var(--primary-dark);margin-bottom:2px;
    text-transform:uppercase;letter-spacing:.02em;}
  .timeline-note{font-size:.9rem;color:var(--ink);margin:2px 0;}
  .timeline-date{font-size:11.5px;color:var(--muted-foreground);}

  .avatar-fab{position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;
    box-shadow:var(--shadow-lift);cursor:pointer;z-index:1000;
    border:3px solid var(--card);background:var(--primary);overflow:hidden;display:none;
    animation:fabPulse 2.4s ease-in-out infinite;}
  .avatar-fab img{width:100%;height:100%;object-fit:cover;display:block;}
  @keyframes fabPulse{
    0%,100%{box-shadow:var(--shadow-lift), 0 0 0 0 oklch(0.5 0.1 165 / .35);}
    50%{box-shadow:var(--shadow-lift), 0 0 0 8px oklch(0.5 0.1 165 / 0);}
  }

  @media (prefers-reduced-motion: reduce){
    .avatar-fab, .hero-wave, .bg-blob, .empty-illustration{animation:none;}
    .story-row, .hero-cover, .card, .timeline-item{animation:none;}
    html{scroll-behavior:auto;}
  }
</style>

</head>
<body>
<div class="bg-blob bg-blob-1"></div>
<div class="bg-blob bg-blob-2"></div>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="brand-dot"></span>NeuroSarathi</div>
    <a href="#" id="signOutLink">Sign out</a>
  </div>

  <div class="disclaimer">
    NeuroSarathi provides educational ideas to support your child's everyday development.
    This is not medical, diagnostic, or therapeutic advice — always consult a qualified
    professional for concerns about your child's health or development.
  </div>

  <div id="app"><div class="loading">Loading your dashboard…</div></div>
</div>

<div class="avatar-fab" id="avatarFab" title="Talk to Sarathi Avatar">
  <img src="/sarathi-avatar.png" alt="Sarathi Avatar">
</div>

<script>
const SUPABASE_URL = "https://qvuenvngwgcknawfsnxl.supabase.co";
const SUPABASE_KEY = "sb_publishable_yxeYwwS9SIxxnavzwhGaxA_koX646U-";
const dash2Client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const SARATHI_CHAT_URL = SUPABASE_URL + "/functions/v1/sarathi-chat";

const FOCUS_OPTIONS = [
  {key:"communication", label:"Communication"},
  {key:"routines", label:"Routines"},
  {key:"focus", label:"Focus"},
  {key:"social_play", label:"Social Play"},
  {key:"big_emotions", label:"Big Emotions"},
  {key:"school_readiness", label:"School Readiness"}
];

const app = document.getElementById("app");
let currentUser = null;
let currentChild = null;
let allChildren = [];

async function init(){
  const { data: { session } } = await dash2Client.auth.getSession();
  if(!session || !session.user){
    window.location.href = "/enterportal.html";
    return;
  }
  currentUser = session.user;
  await loadChildren();
}

async function loadChildren(selectId){
  app.innerHTML = '<div class="loading">Loading your dashboard…</div>';
  const { data, error } = await dash2Client
    .from("children")
    .select("*")
    .eq("parent_id", currentUser.id)
    .is("deleted_at", null)
    .order("created_at", { ascending: true });

  if(error){
    app.innerHTML = '<div class="card"><p class="error">Could not load your dashboard: '+error.message+'</p></div>';
    return;
  }

  allChildren = data || [];

  if(allChildren.length === 0){
    currentChild = null;
    renderAddChildForm();
  } else {
    if(selectId){
      currentChild = allChildren.find(c=>c.id===selectId) || allChildren[0];
    } else if(currentChild){
      currentChild = allChildren.find(c=>c.id===currentChild.id) || allChildren[0];
    } else {
      currentChild = allChildren[0];
    }
    renderFeed(currentChild);
  }
  updateAvatarFab();
}

function updateAvatarFab(){
  const fab = document.getElementById("avatarFab");
  if(!fab) return;
  fab.style.display = currentChild ? "block" : "none";
}

function renderAddChildForm(prefill){
  const p = prefill || {};
  const selected = new Set(p.focus_areas || []);
  const isFirstEver = !p.id && allChildren.length === 0;
  const initialFit = p.photo_fit || "cover";
  const initialZoom = p.photo_zoom || 130;
  const initialFocusY = (p.photo_focus_y !== undefined && p.photo_focus_y !== null) ? p.photo_focus_y : 30;

  app.innerHTML = `
    <div class="card">
      ${isFirstEver ? '<img src="/sarathi-avatar.png" alt="Sarathi Avatar" class="empty-illustration">' : ''}
      <h1 style="${isFirstEver ? 'text-align:center;' : ''}">${p.id ? "Edit your child's info" : "Let's add your child"}</h1>
      <p style="${isFirstEver ? 'text-align:center;' : ''}">Just a few details so we can guide you with the right ideas each day.</p>

      <label for="cPhoto">Photo (used as their banner)</label>
      <input type="file" id="cPhoto" accept="image/*">
      <div id="photoCropSection" style="display:none;margin-top:12px;">
        <div id="photoPreviewBox" style="width:100%;aspect-ratio:3/1.1;border-radius:16px;overflow:hidden;
          background:oklch(0.3 0.03 265);background-size:cover;background-position:50% 30%;
          border:1px solid var(--border);"></div>

        <label style="margin-top:12px;">How should it be shown?</label>
        <div class="chip-grid">
          <div class="chip crop-fit-chip ${initialFit==='cover'?'selected':''}" data-fit="cover">Zoom to face</div>
          <div class="chip crop-fit-chip ${initialFit==='contain'?'selected':''}" data-fit="contain">Show full photo</div>
        </div>

        <div id="zoomControls" style="${initialFit==='contain' ? 'display:none;' : ''}">
          <label for="cZoom">Zoom</label>
          <input type="range" id="cZoom" min="100" max="220" value="${initialZoom}" style="width:100%;">

          <label for="cFocusY">Vertical position</label>
          <input type="range" id="cFocusY" min="0" max="100" value="${initialFocusY}" style="width:100%;">
        </div>
      </div>

      <label for="cName">Child's name</label>
      <input type="text" id="cName" value="${p.display_name ? escapeHtml(p.display_name) : ""}" placeholder="e.g. Aarav">

      <label for="cAge">Age (years)</label>
      <input type="number" id="cAge" min="0" max="18" value="${p.age !== undefined && p.age !== null ? p.age : ""}" placeholder="e.g. 4">

      <label for="cGender">Gender (optional)</label>
      <select id="cGender">
        <option value="unknown" ${!p.biological_sex || p.biological_sex==='unknown' ? 'selected':''}>Prefer not to say</option>
        <option value="M" ${p.biological_sex==='M' ? 'selected':''}>Male</option>
        <option value="F" ${p.biological_sex==='F' ? 'selected':''}>Female</option>
        <option value="I" ${p.biological_sex==='I' ? 'selected':''}>Intersex</option>
      </select>

      <label>What would you like help nurturing?</label>
      <div class="chip-grid" id="focusGrid">
        ${FOCUS_OPTIONS.map(o => `<div class="chip ${selected.has(o.key)?'selected':''}" data-key="${o.key}">${o.label}</div>`).join("")}
      </div>

      <label for="cFoodNotes">Food sensitivities or preferences (optional)</label>
      <textarea id="cFoodNotes" rows="2" placeholder="e.g. avoids dairy, prefers soft textures, no nuts">${p.food_notes ? escapeHtml(p.food_notes) : ""}</textarea>

      <label>Diet type</label>
      <div class="chip-grid" id="dietTypeGrid" style="margin-bottom:14px;">
        <div class="chip ${(p.diet_type||'veg')==='veg'?'selected':''}" data-diet="veg">🥦 Vegetarian</div>
        <div class="chip ${p.diet_type==='eggetarian'?'selected':''}" data-diet="eggetarian">🥚 Eggetarian</div>
        <div class="chip ${p.diet_type==='non_veg'?'selected':''}" data-diet="non_veg">🍗 Non-vegetarian</div>
      </div>

      <div id="formError" class="error"></div>
      <button class="btn" id="saveChildBtn">${p.id ? "Save changes" : "Add my child"}</button>
      ${(p.id || (allChildren.length > 0 && currentChild)) ? '<button class="btn secondary" id="cancelEditBtn">Cancel</button>' : ''}
    </div>
  `;

  document.querySelectorAll("#focusGrid .chip").forEach(chip=>{
    chip.addEventListener("click", ()=> chip.classList.toggle("selected"));
  });
  document.querySelectorAll("#dietTypeGrid .chip").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      document.querySelectorAll("#dietTypeGrid .chip").forEach(c=>c.classList.remove("selected"));
      chip.classList.add("selected");
    });
  });

  let currentPhotoUrl = null;

  function updateCropPreview(){
    const box = document.getElementById("photoPreviewBox");
    if(!box || !currentPhotoUrl) return;
    const fit = document.querySelector(".crop-fit-chip.selected")?.dataset.fit || "cover";
    if(fit === "contain"){
      box.style.backgroundImage = `url('${currentPhotoUrl}')`;
      box.style.backgroundSize = "contain";
      box.style.backgroundPosition = "center";
      box.style.backgroundColor = "oklch(0.3 0.03 265)";
    } else {
      const zoom = document.getElementById("cZoom").value;
      const focusY = document.getElementById("cFocusY").value;
      box.style.backgroundImage = `url('${currentPhotoUrl}')`;
      box.style.backgroundSize = zoom + "%";
      box.style.backgroundPosition = `50% ${focusY}%`;
      box.style.backgroundColor = "transparent";
    }
  }

  document.querySelectorAll(".crop-fit-chip").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      document.querySelectorAll(".crop-fit-chip").forEach(c=>c.classList.remove("selected"));
      chip.classList.add("selected");
      document.getElementById("zoomControls").style.display = chip.dataset.fit === "contain" ? "none" : "block";
      updateCropPreview();
    });
  });
  document.getElementById("cZoom").addEventListener("input", updateCropPreview);
  document.getElementById("cFocusY").addEventListener("input", updateCropPreview);

  if(p.id && p.photo_path){
    getChildPhotoUrl(p).then(url=>{
      if(url){
        currentPhotoUrl = url;
        document.getElementById("photoCropSection").style.display = "block";
        updateCropPreview();
      }
    });
  }

  document.getElementById("cPhoto").addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      currentPhotoUrl = ev.target.result;
      document.getElementById("photoCropSection").style.display = "block";
      updateCropPreview();
    };
    reader.readAsDataURL(file);
  });

  document.getElementById("saveChildBtn").addEventListener("click", ()=> saveChild(p.id));
  const cancelBtn = document.getElementById("cancelEditBtn");
  if(cancelBtn) cancelBtn.addEventListener("click", ()=> renderFeed(currentChild));
}

async function saveChild(existingId){
  const name = document.getElementById("cName").value.trim();
  const ageVal = document.getElementById("cAge").value;
  const gender = document.getElementById("cGender").value;
  const focus = Array.from(document.querySelectorAll("#focusGrid .chip.selected")).map(c=>c.dataset.key);
  const foodNotes = document.getElementById("cFoodNotes") ? document.getElementById("cFoodNotes").value.trim() : "";
  const dietTypeEl = document.querySelector("#dietTypeGrid .chip.selected");
  const dietType = dietTypeEl ? dietTypeEl.dataset.diet : "veg";
  const photoFile = document.getElementById("cPhoto").files[0];
  const cropFit = document.querySelector(".crop-fit-chip.selected")?.dataset.fit || "cover";
  const cropZoom = document.getElementById("cZoom") ? parseFloat(document.getElementById("cZoom").value) : 130;
  const cropFocusY = document.getElementById("cFocusY") ? parseFloat(document.getElementById("cFocusY").value) : 30;
  const errEl = document.getElementById("formError");

  if(!name){
    errEl.textContent = "Please enter your child's name.";
    return;
  }

  const saveBtn = document.getElementById("saveChildBtn");
  saveBtn.textContent = "Saving...";
  saveBtn.disabled = true;

  const payload = {
    display_name: name,
    age: ageVal ? parseInt(ageVal, 10) : null,
    biological_sex: gender,
    focus_areas: focus,
    food_notes: foodNotes || null,
    diet_type: dietType,
    photo_fit: cropFit,
    photo_zoom: cropZoom,
    photo_focus_y: cropFocusY
  };

  let result;
  if(existingId){
    result = await dash2Client.from("children").update(payload).eq("id", existingId).select();
  } else {
    payload.parent_id = currentUser.id;
    result = await dash2Client.from("children").insert(payload).select();
  }

  if(result.error){
    errEl.textContent = "Could not save: " + result.error.message;
    saveBtn.textContent = existingId ? "Save changes" : "Add my child";
    saveBtn.disabled = false;
    return;
  }

  const savedChild = result.data[0];

  if(photoFile){
    const ext = (photoFile.name.split(".").pop() || "jpg").toLowerCase();
    const path = `${currentUser.id}/${savedChild.id}.${ext}`;
    const { error: uploadError } = await dash2Client.storage
      .from("child-photos")
      .upload(path, photoFile, { upsert: true });

    if(uploadError){
      errEl.textContent = "Saved, but photo upload failed: " + uploadError.message;
    } else {
      await dash2Client.from("children").update({ photo_path: path }).eq("id", savedChild.id);
    }
  }

  await loadChildren(savedChild.id);
}

async function getChildPhotoUrl(child){
  if(!child.photo_path) return null;
  const { data, error } = await dash2Client.storage
    .from("child-photos")
    .createSignedUrl(child.photo_path, 3600);
  if(error || !data) return null;
  return data.signedUrl;
}

function photoStyleFor(child){
  const fit = child.photo_fit || "cover";
  const zoom = child.photo_zoom || 100;
  const focusY = (child.photo_focus_y !== undefined && child.photo_focus_y !== null) ? child.photo_focus_y : 30;
  if(fit === "contain"){
    return { backgroundSize: "contain", backgroundPosition: "center", backgroundColor: "oklch(0.3 0.03 265)" };
  }
  return { backgroundSize: zoom + "%", backgroundPosition: `50% ${focusY}%`, backgroundColor: "transparent" };
}

function applyPhotoToEl(el, url, child){
  if(!el || !url) return;
  const style = photoStyleFor(child);
  el.style.backgroundImage = `url('${url}')`;
  el.style.backgroundSize = style.backgroundSize;
  el.style.backgroundPosition = style.backgroundPosition;
  el.style.backgroundColor = style.backgroundColor;
  el.style.backgroundRepeat = "no-repeat";
  el.textContent = "";
}

async function loadChildPhotos(){
  // Hero thumbnail for the currently viewed child
  const activeChild = allChildren.find(c=>c.id===currentChild.id);
  if(activeChild && activeChild.photo_path){
    const url = await getChildPhotoUrl(activeChild);
    applyPhotoToEl(document.getElementById("heroPhoto"), url, activeChild);
    // Composer + post-header avatars for the active child (always cover, small circles)
    ["composerAvatar", "postAvatarIdea", "postAvatarProgress"].forEach(id=>{
      const el = document.getElementById(id);
      if(url && el){
        el.style.backgroundImage = `url('${url}')`;
        el.style.backgroundSize = "cover";
        el.style.backgroundPosition = `50% ${(activeChild.photo_focus_y !== undefined && activeChild.photo_focus_y !== null) ? activeChild.photo_focus_y : 30}%`;
        el.textContent = "";
      }
    });
  }

  // Story-ring thumbnails for every child with a photo
  allChildren.forEach(async (c)=>{
    if(!c.photo_path) return;
    const url = await getChildPhotoUrl(c);
    const el = document.getElementById(`storyAvatar-${c.id}`);
    if(url && el){
      el.style.backgroundImage = `url('${url}')`;
      el.style.backgroundSize = "cover";
      el.style.backgroundPosition = `50% ${(c.photo_focus_y !== undefined && c.photo_focus_y !== null) ? c.photo_focus_y : 30}%`;
      el.textContent = "";

  });
}

async function saveMilestone(child){
  const focus_area = document.getElementById("mFocus").value;
  const note = document.getElementById("mNote").value.trim();
  const milestone_date = document.getElementById("mDate").value.trim();
  const errEl = document.getElementById("mError");

  if(!note){
    errEl.textContent = "Please add a short note about what happened.";
    return;
  }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(milestone_date)){
    errEl.textContent = "Please enter the date as YYYY-MM-DD.";
    return;
  }

  const { error } = await dash2Client.from("child_milestones").insert({
    child_id: child.id,
    focus_area,
    note,
    milestone_date
  });

  if(error){
    errEl.textContent = "Could not save: " + error.message;
    return;
  }

  document.getElementById("progressPanel").innerHTML =
    '<p class="success-pop" style="margin-top:14px;color:var(--primary);font-weight:700;">✓ Milestone saved 🎉</p>';
}

async function showProgress(child){
  const panel = document.getElementById("progressPanel");
  panel.innerHTML = '<p style="margin-top:14px;">Loading…</p>';

  const { data, error } = await dash2Client
    .from("child_milestones")
    .select("*")
    .eq("child_id", child.id)
    .order("milestone_date", { ascending: false });

  if(error){
    panel.innerHTML = '<p class="error" style="margin-top:14px;">Could not load progress: '+error.message+'</p>';
    return;
  }

  if(!data || data.length === 0){
    panel.innerHTML = '<p style="margin-top:14px;color:var(--ink-soft);">No milestones logged yet for '+escapeHtml(child.display_name)+'. Add the first one above!</p>';

      <div class="timeline-dot"></div>
      <div class="timeline-tag">${focusLabel(m.focus_area)}</div>
      <div class="timeline-note">${escapeHtml(m.note)}</div>

    </div>
  `;
}

function todaysSuggestion(focusLabels){
  if(focusLabels.length === 0){
    return "Try a few minutes of calm, focused play together today — following your child's lead.";
  }
  const area = focusLabels[Math.floor(Math.random()*focusLabels.length)];
  const ideas = {
    "Communication":"Narrate what you're doing during a routine task — it gives your child gentle, low-pressure language exposure.",
    "Routines":"Use a simple visual cue (like a picture card) before transitioning to the next activity today.",
    "Focus":"Try a short, single-step task with a clear start and end — celebrate the finish, however small.",
    "Social Play":"Sit alongside your child during play and imitate what they're doing, without directing it.",
    "Big Emotions":"Name the feeling you notice ('That looked frustrating') before offering any solution.",
    "School Readiness":"Practice one small self-help step today, like packing a bag or putting on shoes."
  };
  return ideas[area] || "Spend a few unhurried minutes together today, following your child's lead.";
}

    .from("activities")
    .select("*")
    .or(`is_public.eq.true,parent_id.eq.${currentUser.id}`)
    .order("created_at", { ascending: false });

  if(error){
    resultsEl.innerHTML = `<div class="card"><p class="error">Could not load activities: ${escapeHtml(error.message)}</p></div>`;
    return;
  }

  let activities = data || [];

  activities = activities.filter(a=>{
    if(a.min_age !== null && child.age !== null && child.age !== undefined && child.age < a.min_age) return false;
    if(a.max_age !== null && child.age !== null && child.age !== undefined && child.age > a.max_age) return false;
    if(focusFilter && !(a.focus_areas || []).includes(focusFilter)) return false;
    if(timeFilter && a.time_minutes > parseInt(timeFilter, 10)) return false;
    if(materialsFilter && a.materials_level !== materialsFilter) return false;
    return true;
  });

  if(activities.length === 0){
    resultsEl.innerHTML = `
      <div class="card">
        <p>No activities match these filters yet. Try widening your filters, or ask Sarathi Avatar to suggest some new ones.</p>
      </div>
    `;
    return;
  }

  resultsEl.innerHTML = activities.map(a => {
    const imgMeta = activityImageMap[a.title];
    const thumbSrc = imgMeta ? `/${imgMeta.slug}-step1.png` : null;
    return `
    <div class="card activity-card" data-id="${a.id}" style="cursor:pointer;">
      ${thumbSrc ? `<img src="${thumbSrc}" alt="" style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;margin-bottom:10px;background:#f4f1de;">` : ''}
      <div class="card-head">
        <div class="card-icon ${a.source==='ai' ? 'gold' : ''}">${a.source==='ai' ? '✨' : '🧩'}</div>
        <h2 style="margin:0;">${escapeHtml(a.title)}</h2>
      </div>
      <p>${escapeHtml(a.objective)}</p>
      <div class="chip-grid">
        <span class="chip" style="cursor:default;">${a.time_minutes} min</span>
        <span class="chip" style="cursor:default;">${a.materials_level === 'none' ? 'No materials' : a.materials_level === 'household' ? 'Household items' : 'Special items'}</span>
        ${(a.focus_areas||[]).map(f=>`<span class="chip" style="cursor:default;">${focusLabel(f)}</span>`).join("")}
      </div>
    </div>
  `;
  }).join("");

  resultsEl.querySelectorAll(".activity-card").forEach(card=>{
    card.addEventListener("click", ()=>{
      const activity = activities.find(a=>a.id===card.dataset.id);
      if(activity) renderActivityDetail(activity);
    });
  });
}

async function generateAiActivities(child){
  const resultsEl = document.getElementById("libraryResults");
  resultsEl.innerHTML = '<div class="loading">Sarathi Avatar is thinking of some ideas…</div>';

  const { data: { session } } = await dash2Client.auth.getSession();
  if(!session){
    window.location.href = "/enterportal.html";
    return;
  }

  const combinedFocusAreas = [
    ...(child.focus_areas || []).map(k=>focusLabel(k)),
    ...(child.ai_focus_areas || [])
  ];

  try {
    const resp = await fetch(SARATHI_CHAT_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + session.access_token
      },
      body: JSON.stringify({
        mode: "generate_activities",
        childId: child.id,
        focusAreas: combinedFocusAreas,
        age: child.age
      })
    });

    const data = await resp.json();
    if(!resp.ok) throw new Error(data.error || "Something went wrong generating activities.");

    let parsed;
    try {
      const cleaned = data.reply.trim().replace(/^```json/i, "").replace(/^```/, "").replace(/```$/, "").trim();
      parsed = JSON.parse(cleaned);
    } catch(e){
      throw new Error("Sarathi Avatar's suggestions weren't in the expected format. Please try again.");
    }

    const rows = (parsed.activities || []).map(a => ({
      title: a.title,
      objective: a.objective,
      steps: a.steps || [],
      materials: a.materials || [],
      materials_level: a.materials_level || "none",
      safety_tip: a.safety_tip || null,
      focus_areas: (a.focus_areas || []).filter(f => FOCUS_OPTIONS.some(o=>o.key===f)),
      min_age: a.min_age || null,
      max_age: a.max_age || null,
      time_minutes: a.time_minutes || 15,
      source: "ai",
      parent_id: currentUser.id,
      child_id: child.id,
      is_public: false
    }));

    if(rows.length > 0){
      await dash2Client.from("activities").insert(rows);
    }

    await loadLibraryResults();
  } catch(err){
    resultsEl.innerHTML = `<div class="card"><p class="error">${escapeHtml(err.message)}</p></div>`;
  }
}

async function openPrintableRoutine(child){
  const printBtn = document.getElementById("printRoutineBtn");
  const originalLabel = printBtn.textContent;
  printBtn.textContent = "Preparing…";
  printBtn.disabled = true;

  try {
    const { data: allItems, error } = await dash2Client
      .from("routine_items")
      .select("*")
      .eq("child_id", child.id)
      .eq("is_recurring", true)
      .order("time_of_day", { ascending: true, nullsFirst: false });

    if(error) throw error;

    const byDay = {};
    DAY_ORDER.forEach(d => byDay[d] = []);
    (allItems || []).forEach(it => {
      (it.days_of_week || []).forEach(d => {
        if(byDay[d]) byDay[d].push(it);
      });
    });

    // Progress report: last 30 days of completions vs scheduled
    const since = new Date();
    since.setDate(since.getDate() - 29);
    const sinceStr = since.toISOString().slice(0,10);

    const { data: completions } = await dash2Client
      .from("routine_completions")
      .select("completion_date")
      .eq("child_id", child.id)

      completionsByDate[c.completion_date] = (completionsByDate[c.completion_date] || 0) + 1;
    });

    // Build last 7 days summary for the report
    const last7 = [];
    for(let i = 6; i >= 0; i--){

    const totalScheduled30 = Object.keys(completionsByDate).length ? null : null; // not used directly

    win.document.write(`

          .pr-grid { display:grid; grid-template-columns: repeat(7, 1fr); gap:10px; margin-bottom:28px; }
          .pr-day { background:#fff; border:1px solid #e0d8c8; border-radius:10px; padding:10px; min-height:180px; }

async function generateAiMeals(child, mealType){
  const resultsEl = document.getElementById("foodResults");
  resultsEl.insertAdjacentHTML("beforebegin", `<div class="card" id="mealGenLoading"><div class="loading">Sarathi is thinking of some meal ideas…</div></div>`);

  const { data: { session } } = await dash2Client.auth.getSession();
  if(!session){
    window.location.href = "/enterportal.html";
    return;
  }

  try {
    // Pull the last 20 AI-suggested meal titles for this child so we don't repeat them
    const since = new Date();
    since.setDate(since.getDate() - 14);
    const { data: recentMeals } = await dash2Client
      .from("meal_ideas")
      .select("title")
      .eq("child_id", child.id)
      .eq("source", "ai")
      .gte("created_at", since.toISOString())
      .order("created_at", { ascending: false })
      .limit(20);
    const excludeTitles = (recentMeals || []).map(m => m.title);

    const resp = await fetch(SARATHI_CHAT_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + session.access_token
      },
      body: JSON.stringify({
        mode: "generate_meals",
        childId: child.id,
        age: child.age,
        foodNotes: child.food_notes || "",
        mealType: mealType ? MEAL_TYPE_LABELS[mealType] : "",
        dietType: child.diet_type || "veg",
        excludeTitles: excludeTitles
      })
    });

    const data = await resp.json();
    if(!resp.ok) throw new Error(data.error || "Something went wrong generating meal ideas.");

    let parsed;
    try {
      const cleaned = data.reply.trim().replace(/^```json/i, "").replace(/^```/, "").replace(/```$/, "").trim();
      parsed = JSON.parse(cleaned);
    } catch(e){
      throw new Error("Sarathi's meal ideas weren't in the expected format. Please try again.");
    }

    document.getElementById("mealGenLoading").remove();
    showMealApproval(child, parsed.meals || []);
  } catch(err){
    const loadingEl = document.getElementById("mealGenLoading");
    if(loadingEl) loadingEl.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
  }
}

function showMealApproval(child, meals){
  const resultsEl = document.getElementById("foodResults");

  if(meals.length === 0){
    resultsEl.insertAdjacentHTML("beforebegin", `<div class="card"><p>Sarathi couldn't generate meal ideas this time. Please try again.</p></div>`);
    return;
  }

  resultsEl.insertAdjacentHTML("beforebegin", `
    <div class="card" id="mealApprovalCard">
      <h2 style="font-size:1rem;">Review Sarathi's meal ideas</h2>
      <p>Uncheck anything you don't want, then add the rest to your Food & Nutrition library.</p>
      ${meals.map((m, i)=>`
        <div class="card" style="margin:10px 0;">
          <label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;">
            <input type="checkbox" class="ma-item-check" data-idx="${i}" checked style="margin-top:4px;">
            <span>
              <strong>${escapeHtml(m.title)}</strong> <span class="chip" style="cursor:default;">${MEAL_TYPE_LABELS[m.meal_type] || m.meal_type}</span>
              <br><span style="font-size:0.9rem;">${escapeHtml(m.description || '')}</span>
            </span>
          </label>
        </div>
      `).join("")}
      <div class="row" style="margin-top:12px;">
        <button class="btn small" id="maSaveBtn">Add selected to library</button>
        <button class="btn small secondary" id="maCancelBtn">Discard</button>
      </div>
    </div>
  `);

  document.getElementById("maCancelBtn").addEventListener("click", ()=>{
    document.getElementById("mealApprovalCard").remove();
  });

  document.getElementById("maSaveBtn").addEventListener("click", async ()=>{
    const checks = document.querySelectorAll(".ma-item-check:checked");
    const rows = Array.from(checks).map(chk=>{
      const m = meals[parseInt(chk.dataset.idx, 10)];
      return {
        title: m.title,
        meal_type: m.meal_type,
        description: m.description,
        ingredients: m.ingredients || [],
        steps: m.steps || [],
        time_minutes: m.time_minutes || null,
        source: "ai",
        parent_id: currentUser.id,
        child_id: child.id,
        is_public: false,
        diet_type: child.diet_type || "veg"
      };
    });

    if(rows.length > 0){
      await dash2Client.from("meal_ideas").insert(rows);
    }

    document.getElementById("mealApprovalCard").remove();
    await loadFoodResults();
  });
}

    .from("learning_resources")

function renderLearningResultsFromCache(){
  const resultsEl = document.getElementById("learningResults");
  let resources = learningResourcesCache;

  if(learningLibraryState.categoryFilter){
    resources = resources.filter(r => r.category === learningLibraryState.categoryFilter);

    resources = resources.filter(r => learningLibraryState.favoriteIds.has(r.id));
  } else if(learningLibraryState.regionFilter){
    resources = resources.filter(r => (r.region || "international") === learningLibraryState.regionFilter);
  }

  if(resources.length === 0){
    resultsEl.innerHTML = `<div class="card"><p>No resources match these filters yet. We're adding more regularly — please check back soon.</p></div>`;

  }

  resultsEl.innerHTML = resources.map(r => {
    const isFav = learningLibraryState.favoriteIds.has(r.id);
    return `
    <div class="card" style="margin-bottom:10px;">
      <div class="card-head">
        <div class="card-icon">${RESOURCE_TYPE_ICONS[r.resource_type] || '📄'}</div>

async function toggleLearningFavorite(resourceId){
  const isFav = learningLibraryState.favoriteIds.has(resourceId);
  if(isFav){
    await dash2Client.from("learning_resource_favorites")
      .delete()
      .eq("parent_id", currentUser.id)
      .eq("resource_id", resourceId);
    learningLibraryState.favoriteIds.delete(resourceId);
  } else {
    await dash2Client.from("learning_resource_favorites").insert({
      parent_id: currentUser.id,
      resource_id: resourceId
    });
    learningLibraryState.favoriteIds.add(resourceId);
  }
  renderLearningResultsFromCache();
}

const SPECIALTY_LABELS = {

  therapist: "Therapist",

  caregiver: "Caregiver"
};

function haversineKm(lat1, lng1, lat2, lng2){
  const toRad = (v) => v * Math.PI / 180;
  const R = 6371;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function geocodePincode(pincode){
  const url = `https://nominatim.openstreetmap.org/search?postalcode=${encodeURIComponent(pincode)}&country=India&format=json&limit=1`;
  const resp = await fetch(url, { headers: { "Accept-Language": "en" } });
  if(!resp.ok) throw new Error("Could not look up that PIN code. Please try again.");
  const data = await resp.json();
  if(!data || data.length === 0) throw new Error("PIN code not found. Please check and try again.");
  return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
}

async function searchProfessionalsByPincode(){
  const pincode = document.getElementById("pfPincode").value.trim();
  const resultsEl = document.getElementById("professionalsResults");

  if(!/^\d{6}$/.test(pincode)){
    resultsEl.innerHTML = `<div class="card"><p class="error">Please enter a valid 6-digit PIN code.</p></div>`;
    return;
  }

  resultsEl.innerHTML = '<div class="loading">Looking up your area…</div>';

  try {
    const loc = await geocodePincode(pincode);
    professionalsState.userLat = loc.lat;
    professionalsState.userLng = loc.lng;
    professionalsState.pincode = pincode;

    resultsEl.innerHTML = '<div class="loading">Finding professionals nearby…</div>';

    const { data: pros, error } = await dash2Client
      .from("professionals")
      .select("*")
      .eq("is_active", true);

    if(error) throw error;

    const withDistance = (pros || [])
      .filter(p => p.lat != null && p.lng != null)
      .map(p => ({ ...p, distanceKm: haversineKm(loc.lat, loc.lng, p.lat, p.lng) }))
      .sort((a,b) => a.distanceKm - b.distanceKm);

    professionalsState.list = withDistance;
    renderProfessionalsList();
  } catch(err){
    resultsEl.innerHTML = `<div class="card"><p class="error">${escapeHtml(err.message)}</p></div>`;
  }
}

function loadChartJs(){
  return new Promise((resolve, reject)=>{
    if(window.Chart){ resolve(); return; }
    const script = document.createElement("script");
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js";
    script.onload = resolve;
    script.onerror = () => reject(new Error("Could not load chart library"));
    document.head.appendChild(script);
  });
}

async function loadProgressReport(){
  const child = progressReportState.child;
  const resultsEl = document.getElementById("progressReportResults");
  resultsEl.innerHTML = '<div class="loading">Loading report…</div>';

  const days = progressReportState.range === "week" ? 7 : 30;
  const since = new Date();
  since.setDate(since.getDate() - (days - 1));
  const sinceStr = since.toISOString().slice(0,10);
  const sinceIso = since.toISOString();

  try {
    await loadChartJs();

    const [milestonesRes, routineItemsRes, routineCompRes, activityCompRes] = await Promise.all([
      dash2Client.from("child_milestones").select("*").eq("child_id", child.id).gte("milestone_date", sinceStr).order("milestone_date", { ascending: false }),
      dash2Client.from("routine_items").select("*").eq("child_id", child.id).eq("is_recurring", true),
      dash2Client.from("routine_completions").select("completion_date").eq("child_id", child.id).gte("completion_date", sinceStr),
      dash2Client.from("activity_completions").select("*, activities(title)").eq("child_id", child.id).gte("completed_at", sinceIso).order("completed_at", { ascending: false })
    ]);

    const milestones = milestonesRes.data || [];
    const routineItems = routineItemsRes.data || [];
    const routineCompletions = routineCompRes.data || [];
    const activityCompletions = activityCompRes.data || [];

    const byDay = {};
    DAY_ORDER.forEach(d => byDay[d] = 0);
    routineItems.forEach(it => (it.days_of_week||[]).forEach(d => { if(byDay[d] !== undefined) byDay[d]++; }));

    const completionsByDate = {};
    routineCompletions.forEach(c => { completionsByDate[c.completion_date] = (completionsByDate[c.completion_date]||0) + 1; });

    let totalScheduled = 0, totalCompleted = 0;
    const dayRows = [];
    for(let i = days - 1; i >= 0; i--){
      const d = new Date();
      d.setDate(d.getDate() - i);
      const dateStr = d.toISOString().slice(0,10);
      const dayCode = DAY_ORDER[(d.getDay() + 6) % 7];
      const scheduled = byDay[dayCode] || 0;
      const completed = completionsByDate[dateStr] || 0;
      totalScheduled += scheduled;
      totalCompleted += completed;
      dayRows.push({ dateStr, scheduled, completed, pct: scheduled > 0 ? Math.round((completed/scheduled)*100) : 0 });
    }
    const overallRate = totalScheduled > 0 ? Math.round((totalCompleted/totalScheduled)*100) : null;

        <div style="background:linear-gradient(135deg,#2a9d8f,#6bc4b6);border-radius:16px;padding:14px 10px;text-align:center;color:#fff;">
          <div style="font-size:1.8rem;">🗓️</div>
          <div style="font-size:1.4rem;font-weight:800;">${overallRate !== null ? overallRate + '%' : '—'}</div>
          <div style="font-size:0.7rem;opacity:0.9;">Routine done</div>
        </div>
        <div style="background:linear-gradient(135deg,#e9c46a,#f4d58d);border-radius:16px;padding:14px 10px;text-align:center;color:#5a4a1a;">
          <div style="font-size:1.8rem;">🧩</div>
          <div style="font-size:1.4rem;font-weight:800;">${activityCompletions.length}</div>
          <div style="font-size:0.7rem;opacity:0.85;">Activities done</div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;align-items:center;">
        <div style="position:relative;height:160px;">
          <canvas id="prDonutCanvas"></canvas>
        </div>
        <div style="height:160px;">
          <canvas id="prBarCanvas"></canvas>
        </div>
      </div>

      <h2 style="font-size:1rem;">🌟 Milestones ${progressReportState.range === 'week' ? 'this week' : 'this month'}</h2>
      ${milestones.length === 0 ? '<p style="font-style:italic;opacity:0.75;">No milestones logged in this period.</p>' : `
        <div class="timeline" style="margin-bottom:16px;">
          ${milestones.map(m => `
            <div class="timeline-item">
              <div class="timeline-dot"></div>

              <div class="timeline-note">${escapeHtml(m.note)}</div>
              <div class="timeline-date">${new Date(m.milestone_date).toLocaleDateString()}</div>
            </div>
          `).join("")}
        </div>
      `}

      <h2 style="font-size:1rem;">🧩 Activities completed</h2>
      ${activityCompletions.length === 0 ? '<p style="font-style:italic;opacity:0.75;">No activities marked done in this period yet. Visit the Activity Library and tap "Mark as done today" after trying one.</p>' : `
        <div class="timeline">
          ${activityCompletions.map(a => `
            <div class="timeline-item">
              <div class="timeline-dot"></div>
              <div class="timeline-note">${escapeHtml(a.activities?.title || 'Activity')}</div>
              <div class="timeline-date">${new Date(a.completed_at).toLocaleDateString()}</div>
            </div>
          `).join("")}
        </div>
      `}
    `;

    if(prDonutChart){ prDonutChart.destroy(); prDonutChart = null; }
    if(prBarChart){ prBarChart.destroy(); prBarChart = null; }

    const donutCtx = document.getElementById("prDonutCanvas");
    if(donutCtx){
      prDonutChart = new Chart(donutCtx, {
        type: "doughnut",
        data: {
          labels: ["Completed", "Missed"],
          datasets: [{
            data: totalScheduled > 0 ? [totalCompleted, Math.max(totalScheduled - totalCompleted, 0)] : [0, 1],
            backgroundColor: ["#2a9d8f", "#f0ebe0"],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: "70%",
          plugins: { legend: { display: false } }
        }
      });
    }

    const barCtx = document.getElementById("prBarCanvas");
    if(barCtx){
      const barColors = dayRows.map(r => r.pct >= 75 ? "#2a9d8f" : r.pct >= 40 ? "#e9c46a" : "#e76f51");
      prBarChart = new Chart(barCtx, {
        type: "bar",
        data: {
          labels: dayRows.map(r => r.dateStr.slice(5)),
          datasets: [{
            data: dayRows.map(r => r.pct),
            backgroundColor: barColors,
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, max: 100, ticks: { callback: v => v + "%" } },
            x: { ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: days === 7 ? 7 : 10 } }
          }
        }
      });
    }
  } catch(err){
    resultsEl.innerHTML = `<div class="card"><p class="error">Could not load report: ${escapeHtml(err.message)}</p></div>`;
  }
}

// ─── Routine Builder ───

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

const routineState = { child: null, view: "checklist", items: [], completions: new Set() };
const DAY_LABELS = { MO:"Mon", TU:"Tue", WE:"Wed", TH:"Thu", FR:"Fri", SA:"Sat", SU:"Sun" };
const DAY_ORDER = ["MO","TU","WE","TH","FR","SA","SU"];

function todayDateStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function todayDayCode(){
  return DAY_ORDER[(new Date().getDay() + 6) % 7]; // getDay(): 0=Sun -> map to MO..SU
}

async function renderRoutineBuilder(child){
  routineState.child = child;
  routineState.view = "checklist";

  app.innerHTML = `
    <div class="card">
      <div class="card-head">
        <div class="card-icon gold">🗓️</div>
        <h1 style="margin:0;">${escapeHtml(child.display_name)}'s Routine</h1>
      </div>
      <div class="row" style="margin:12px 0;">
        <button class="btn small" id="viewChecklistBtn">☑️ Checklist</button>
        <button class="btn small secondary" id="viewTimelineBtn">🕐 Timeline</button>
        <button class="btn small secondary" id="addRoutineItemBtn">+ Add item</button>
        <button class="btn small secondary" id="generateRoutineBtn">✨ Generate with AI</button>
        <button class="btn small secondary" id="printRoutineBtn">🖨️ Print / Download</button>
      </div>
      <div id="routineResults"><div class="loading">Loading routine…</div></div>
      <button class="btn secondary" id="routineBackBtn" style="margin-top:16px;">Back to dashboard</button>
    </div>
  `;

  document.getElementById("routineBackBtn").addEventListener("click", ()=> renderFeed(child));
  document.getElementById("addRoutineItemBtn").addEventListener("click", ()=> showRoutineItemForm(child));
  document.getElementById("generateRoutineBtn").addEventListener("click", ()=> showAgeBandConfirm(child));
  document.getElementById("printRoutineBtn").addEventListener("click", ()=> openPrintableRoutine(child));
  document.getElementById("viewChecklistBtn").addEventListener("click", ()=> switchRoutineView("checklist"));
  document.getElementById("viewTimelineBtn").addEventListener("click", ()=> switchRoutineView("timeline"));

  await loadRoutineData();
}

function switchRoutineView(view){
  routineState.view = view;
  document.getElementById("viewChecklistBtn").className = view === "checklist" ? "btn small" : "btn small secondary";
  document.getElementById("viewTimelineBtn").className = view === "timeline" ? "btn small" : "btn small secondary";
  renderRoutineList();
}

async function loadRoutineData(){
  const child = routineState.child;
  const resultsEl = document.getElementById("routineResults");
  resultsEl.innerHTML = '<div class="loading">Loading routine…</div>';

  const { data: items, error } = await dash2Client
    .from("routine_items")
    .select("*")
    .eq("child_id", child.id)
    .order("time_of_day", { ascending: true, nullsFirst: false })
    .order("sort_order", { ascending: true });

  if(error){
    resultsEl.innerHTML = `<div class="card"><p class="error">Could not load routine: ${escapeHtml(error.message)}</p></div>`;
    return;
  }

  const today = todayDateStr();
  const dayCode = todayDayCode();

  routineState.items = (items || []).filter(it => {
    if(it.is_recurring) return (it.days_of_week||[]).includes(dayCode);
    return it.specific_date === today;
  });

  const { data: comps, error: compErr } = await dash2Client
    .from("routine_completions")
    .select("routine_item_id")
    .eq("child_id", child.id)
    .eq("completion_date", today);

  routineState.completions = new Set(compErr ? [] : (comps||[]).map(c=>c.routine_item_id));

  renderRoutineList();
}

function renderRoutineList(){
  const resultsEl = document.getElementById("routineResults");
  const items = routineState.items;

  if(items.length === 0){
    resultsEl.innerHTML = `
      <div class="card">
        <p>No routine items for today yet. Tap "+ Add item" to build ${escapeHtml(routineState.child.display_name)}'s day.</p>
      </div>
    `;
    return;
  }

  if(routineState.view === "checklist"){
    resultsEl.innerHTML = `
      <div class="timeline">
        ${items.map(it => {
          const done = routineState.completions.has(it.id);
          return `
          <div class="timeline-item">
            <div class="timeline-dot" style="cursor:pointer;background:${done ? '#2a9d8f' : ''};" data-toggle-id="${it.id}"></div>
            <div class="timeline-note" style="${done ? 'text-decoration:line-through;opacity:0.6;' : ''}">
              ${it.icon || '⭐'} ${escapeHtml(it.title)}
              ${it.time_of_day ? `<span class="chip" style="cursor:default;margin-left:8px;">${it.time_of_day.slice(0,5)}</span>` : ''}
              <button class="btn small secondary" style="margin-left:8px;" data-delete-id="${it.id}">Delete</button>
            </div>
          </div>
        `; }).join("")}
      </div>
    `;
  } else {
    const timed = items.filter(it => it.time_of_day);
    const untimed = items.filter(it => !it.time_of_day);
    resultsEl.innerHTML = `
      <div class="timeline">
        ${timed.map(it => {
          const done = routineState.completions.has(it.id);
          return `
          <div class="timeline-item">
            <div class="timeline-dot" style="cursor:pointer;background:${done ? '#2a9d8f' : ''};" data-toggle-id="${it.id}"></div>
            <div class="timeline-note" style="${done ? 'text-decoration:line-through;opacity:0.6;' : ''}">
              <strong>${it.time_of_day.slice(0,5)}</strong> — ${it.icon || '⭐'} ${escapeHtml(it.title)}
              <button class="btn small secondary" style="margin-left:8px;" data-delete-id="${it.id}">Delete</button>
            </div>
          </div>
        `; }).join("")}
      </div>
      ${untimed.length ? `
        <h2 style="font-size:1rem;margin-top:16px;">Anytime today</h2>
        <div class="timeline">
          ${untimed.map(it => {
            const done = routineState.completions.has(it.id);
            return `
            <div class="timeline-item">
              <div class="timeline-dot" style="cursor:pointer;background:${done ? '#2a9d8f' : ''};" data-toggle-id="${it.id}"></div>
              <div class="timeline-note" style="${done ? 'text-decoration:line-through;opacity:0.6;' : ''}">
                ${it.icon || '⭐'} ${escapeHtml(it.title)}
                <button class="btn small secondary" style="margin-left:8px;" data-delete-id="${it.id}">Delete</button>
              </div>
            </div>
          `; }).join("")}
        </div>
      ` : ''}
    `;
  }

  resultsEl.querySelectorAll("[data-toggle-id]").forEach(el=>{
    el.addEventListener("click", ()=> toggleRoutineCompletion(el.dataset.toggleId));
  });
  resultsEl.querySelectorAll("[data-delete-id]").forEach(el=>{
    el.addEventListener("click", ()=> deleteRoutineItem(el.dataset.deleteId));
  });
}

async function toggleRoutineCompletion(itemId){
  const child = routineState.child;
  const today = todayDateStr();
  const isDone = routineState.completions.has(itemId);

  if(isDone){
    await dash2Client.from("routine_completions")
      .delete()
      .eq("routine_item_id", itemId)
      .eq("completion_date", today);
    routineState.completions.delete(itemId);
  } else {
    await dash2Client.from("routine_completions").insert({
      routine_item_id: itemId,
      child_id: child.id,
      completion_date: today
    });
    routineState.completions.add(itemId);
  }
  renderRoutineList();
}

async function deleteRoutineItem(itemId){
  await dash2Client.from("routine_items").delete().eq("id", itemId);
  await loadRoutineData();
}

const AGE_BANDS = ["0-3","3-5","5-7","7-10","10-15","15-20","20+"];

function detectAgeBand(age){
  if(age == null) return "5-7";
  if(age < 3) return "0-3";
  if(age < 5) return "3-5";
  if(age < 7) return "5-7";
  if(age < 10) return "7-10";
  if(age < 15) return "10-15";
  if(age < 20) return "15-20";
  return "20+";
}

function showAgeBandConfirm(child){
  const resultsEl = document.getElementById("routineResults");
  const detected = detectAgeBand(child.age);

  resultsEl.insertAdjacentHTML("beforebegin", `
    <div class="card" id="ageBandFormCard">
      <h2 style="font-size:1rem;">Generate routine with AI</h2>
      <p>Based on ${escapeHtml(child.display_name)}'s profile, this looks like the right age band. Adjust if needed:</p>
      <div class="chip-grid" id="ageBandRow" style="margin:8px 0;">
        ${AGE_BANDS.map(b=>`<span class="chip" data-band="${b}" style="cursor:pointer;${b===detected?'background:#2a9d8f;color:#fff;':''}">${b} yrs</span>`).join("")}
      </div>
      <div class="row">
        <button class="btn small" id="abConfirmBtn">Generate</button>
        <button class="btn small secondary" id="abCancelBtn">Cancel</button>
      </div>
    </div>
  `);

  let selectedBand = detected;
  document.querySelectorAll("#ageBandRow .chip").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      selectedBand = chip.dataset.band;
      document.querySelectorAll("#ageBandRow .chip").forEach(c=>{
        c.style.background = ""; c.style.color = "";
      });
      chip.style.background = "#2a9d8f"; chip.style.color = "#fff";
    });
  });

  document.getElementById("abCancelBtn").addEventListener("click", ()=>{
    document.getElementById("ageBandFormCard").remove();
  });

  document.getElementById("abConfirmBtn").addEventListener("click", ()=>{
    document.getElementById("ageBandFormCard").remove();
    generateAiRoutine(child, selectedBand);
  });
}

async function generateAiRoutine(child, ageBand){
  const resultsEl = document.getElementById("routineResults");
  resultsEl.insertAdjacentHTML("beforebegin", `<div class="card" id="routineGenLoading"><div class="loading">Sarathi is building a routine for the ${ageBand} yrs band…</div></div>`);

  const { data: { session } } = await dash2Client.auth.getSession();
  if(!session){
    window.location.href = "/enterportal.html";
    return;
  }

  const combinedFocusAreas = [
    ...(child.focus_areas || []).map(k=>focusLabel(k)),
    ...(child.ai_focus_areas || [])
  ];

  try {
    const resp = await fetch(SARATHI_CHAT_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + session.access_token
      },
      body: JSON.stringify({
        mode: "generate_routine",
        childId: child.id,
        childName: child.display_name,
        ageBand: ageBand,
        focusAreas: combinedFocusAreas
      })
    });

    const data = await resp.json();
    if(!resp.ok) throw new Error(data.error || "Something went wrong generating the routine.");

    let parsed;
    try {
      const cleaned = data.reply.trim().replace(/^```json/i, "").replace(/^```/, "").replace(/```$/, "").trim();
      parsed = JSON.parse(cleaned);
    } catch(e){
      throw new Error("Sarathi's routine wasn't in the expected format. Please try again.");
    }

    document.getElementById("routineGenLoading").remove();
    showRoutineApproval(child, parsed.routine_items || []);
  } catch(err){
    const loadingEl = document.getElementById("routineGenLoading");
    if(loadingEl) loadingEl.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
  }
}

function showRoutineApproval(child, items){

    return;

  resultsEl.insertAdjacentHTML("beforebegin", `
    <div class="card" id="routineApprovalCard">
      <h2 style="font-size:1rem;">Review Sarathi's suggested routine</h2>
      <p>Uncheck anything you don't want, then add the rest to ${escapeHtml(child.display_name)}'s routine.</p>

                <span>

        <button class="btn small secondary" id="raCancelBtn">Discard</button>
      </div>

  `);

  document.getElementById("raCancelBtn").addEventListener("click", ()=>{

  });

  document.getElementById("raSaveBtn").addEventListener("click", async ()=>{
    const checks = document.querySelectorAll(".ra-item-check:checked");

    if(rows.length > 0){

  });

    <div class="card" style="margin:10px 0;display:flex;justify-content:space-between;align-items:center;">
      <div>
        <strong>${escapeHtml(p.label)}</strong>
      </div>
      <div style="font-weight:700;">₹${p.price}</div>
    </div>
  `).join("");

  app.innerHTML = `
    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
        <img src="/sarathi-avatar.png" alt="Sarathi Avatar" style="width:44px;height:44px;border-radius:50%;">
        <h1 style="margin:0;">${escapeHtml(data.title || "Upgrade to keep chatting")}</h1>
      </div>
      <p>${escapeHtml(data.message || "")}</p>
      ${plansHtml}
      <button class="btn" id="goToSarathiBillingBtn">View plans & upgrade</button>
      <button class="btn secondary" id="avatarBackBtn">Back to dashboard</button>
    </div>
  `;

  document.getElementById("goToSarathiBillingBtn").addEventListener("click", ()=>{
    window.location.href = "/sarathi-billing.html";
  });
  document.getElementById("avatarBackBtn").addEventListener("click", ()=> renderFeed(currentChild));
}

function renderAvatarChatTurn(){
  const { child, messages } = avatarState;
  const lastAssistant = [...messages].reverse().find(m=>m.role==="assistant");

  const historyHtml = messages.map(m => `
    <div style="margin-bottom:10px;">
      <div style="font-size:12px;font-weight:600;color:${m.role==='assistant' ? 'var(--primary)' : 'var(--ink-soft)'};margin-bottom:2px;">
        ${m.role === 'assistant' ? 'Sarathi Avatar' : 'You'}
      </div>
      <div style="font-size:14px;color:var(--ink);">${escapeHtml(m.content)}</div>
    </div>
  `).join("");

  app.innerHTML = `
    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
        <img src="/sarathi-avatar.png" alt="Sarathi Avatar" style="width:44px;height:44px;border-radius:50%;">
        <h1 style="margin:0;">Chatting about ${escapeHtml(child.display_name)}</h1>
      </div>
      ${avatarState.lastWarning ? `<div class="card" style="background:#FFF4E5;border-color:#FFD9A0;margin-bottom:12px;"><p style="margin:0;font-size:13px;">⚠️ ${escapeHtml(avatarState.lastWarning)}</p></div>` : ''}
      <div style="max-height:280px;overflow-y:auto;margin-bottom:12px;">${historyHtml}</div>
      <label for="chatReply">Your reply</label>
      <input type="text" id="chatReply" placeholder="Type your reply...">
      <div id="avatarError" class="error"></div>
      <button class="btn" id="chatSendBtn">Send</button>
      <button class="btn secondary" id="chatFinalizeBtn">I'm done — show suggestions</button>
      <button class="btn secondary" id="avatarCancelBtn">Cancel</button>
    </div>
  `;

  document.getElementById("chatSendBtn").addEventListener("click", ()=>{
    const input = document.getElementById("chatReply");
    const val = input.value.trim();
    const errEl = document.getElementById("avatarError");
    if(!val){
      errEl.textContent = "Please type a reply first.";
      return;
    }
    avatarState.messages.push({ role: "user", content: val });
    fetchAvatarReply(false);
  });

  document.getElementById("chatFinalizeBtn").addEventListener("click", ()=> fetchAvatarReply(true));
  document.getElementById("avatarCancelBtn").addEventListener("click", ()=> renderFeed(currentChild));
}

function handleFinalizeReply(rawReply){
  let parsed;
  try {
    const cleaned = rawReply.trim().replace(/^```json/i, "").replace(/^```/, "").replace(/```$/, "").trim();
    parsed = JSON.parse(cleaned);
  } catch(e){
    app.innerHTML = `
      <div class="card">
        <h1>Hmm, that didn't parse</h1>
        <p>Sarathi Avatar's response wasn't in the expected format. You can try finalizing again.</p>
        <button class="btn" id="retryFinalizeBtn">Try again</button>
        <button class="btn secondary" id="avatarCancelBtn">Back to dashboard</button>
      </div>
    `;
    document.getElementById("retryFinalizeBtn").addEventListener("click", ()=> fetchAvatarReply(true));
    document.getElementById("avatarCancelBtn").addEventListener("click", ()=> renderFeed(currentChild));
    return;
  }

  const suggestions = (parsed.suggestions || []).map(s => ({ ...s, approved: true }));
  avatarState.suggestions = suggestions;
  renderSuggestionApproval();
}

function renderSuggestionApproval(){
  const { child, suggestions } = avatarState;

  app.innerHTML = `
    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
        <img src="/sarathi-avatar.png" alt="Sarathi Avatar" style="width:44px;height:44px;border-radius:50%;">
        <h1 style="margin:0;">Suggested focus areas for ${escapeHtml(child.display_name)}</h1>
      </div>
      <p>Based on your conversation, Sarathi Avatar suggests these. Tap any to remove it — only the ones you approve will be saved.</p>
      <div class="chip-grid" id="suggestionGrid" style="margin-top:14px;">
        ${suggestions.map((s,i) => `
          <div class="chip ${s.approved ? 'selected' : ''}" data-idx="${i}" title="${escapeHtml(s.reason||'')}">${escapeHtml(s.label)}</div>
        `).join("")}
      </div>
      <div id="avatarError" class="error"></div>
      <button class="btn" id="saveSuggestionsBtn">Save approved areas</button>
      <button class="btn secondary" id="avatarCancelBtn">Cancel</button>
    </div>
  `;

  document.querySelectorAll("#suggestionGrid .chip").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      const idx = parseInt(chip.dataset.idx, 10);
      avatarState.suggestions[idx].approved = !avatarState.suggestions[idx].approved;
      chip.classList.toggle("selected");
    });
  });

  document.getElementById("saveSuggestionsBtn").addEventListener("click", saveApprovedSuggestions);
  document.getElementById("avatarCancelBtn").addEventListener("click", ()=> renderFeed(currentChild));
}

async function saveApprovedSuggestions(){
  const { child, suggestions } = avatarState;
  const approvedLabels = suggestions.filter(s=>s.approved).map(s=>s.label);
  const errEl = document.getElementById("avatarError");

  const { error } = await dash2Client
    .from("children")
    .update({ ai_focus_areas: approvedLabels })
    .eq("id", child.id);

  if(error){
    errEl.textContent = "Could not save: " + error.message;
    return;
  }

  avatarState = null;
  await loadChildren(child.id);
}

document.getElementById("avatarFab").addEventListener("click", ()=>{
  if(currentChild) startAvatarIntake(currentChild);
});

document.getElementById("signOutLink").addEventListener("click", async (e)=>{
  e.preventDefault();
  await dash2Client.auth.signOut();
  window.location.href = "/enterportal.html";
});

init();
</script>
</body>
</html>
