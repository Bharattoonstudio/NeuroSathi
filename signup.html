<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up · NeuroSarathi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --background: oklch(0.983 0.012 85);
  --ink: oklch(0.22 0.035 265);
  --ink-soft: oklch(0.38 0.028 260);
  --card: oklch(0.985 0.008 80);
  --primary: oklch(0.5 0.1 165);
  --primary-foreground: oklch(0.983 0.012 85);
  --sage-soft: oklch(0.92 0.03 145);
  --terracotta: oklch(0.62 0.13 45);
  --muted-foreground: oklch(0.48 0.025 260);
  --border: oklch(0.88 0.02 70);
  --shadow-lift: 0 2px 4px oklch(0.22 0.035 265 / 0.05), 0 24px 60px -20px oklch(0.28 0.08 265 / 0.18);
}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--background);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
  background-image: radial-gradient(1000px 500px at 15% 0%, oklch(0.92 0.05 55 / .45), transparent 60%), radial-gradient(800px 500px at 100% 100%, oklch(0.9 0.04 145 / .3), transparent 60%);
}
.logo{height:64px;width:auto;margin-bottom:28px;display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:28px;padding:36px 32px;max-width:420px;width:100%;box-shadow:var(--shadow-lift)}
h1{font-family:'Fraunces',serif;font-weight:500;font-size:1.8rem;margin-bottom:8px;color:var(--ink)}
p.sub{color:var(--ink-soft);margin-bottom:24px;font-size:.95rem}
input{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--border);margin-bottom:14px;font-family:inherit;font-size:.95rem;background:var(--background);color:var(--ink)}
input:focus{outline:none;border-color:var(--terracotta)}
.consent-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:18px;}
.consent-row input[type="checkbox"]{width:auto;margin:2px 0 0 0;flex-shrink:0;accent-color:var(--terracotta);}
.consent-row label{font-size:.85rem;color:var(--ink-soft);line-height:1.45;}
.consent-row a{color:var(--terracotta);font-weight:600;text-decoration:none}
.btn-primary{width:100%;background:var(--primary);color:var(--primary-foreground);border:none;padding:14px;border-radius:999px;font-weight:600;font-size:1rem;cursor:pointer;transition:transform .2s;box-shadow:var(--shadow-lift)}
.btn-primary:hover{transform:scale(1.01)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
.msg{font-size:.85rem;margin-top:14px;padding:10px 14px;border-radius:10px;display:none}
.msg.error{display:block;background:oklch(0.93 0.05 25);color:oklch(0.4 0.15 25)}
.msg.success{display:block;background:var(--sage-soft);color:oklch(0.35 0.08 150)}
.switch{margin-top:22px;text-align:center;font-size:.9rem;color:var(--ink-soft)}
.switch a{color:var(--terracotta);font-weight:600;text-decoration:none}
.back{margin-top:18px;text-align:center}
.back a{color:var(--muted-foreground);font-size:.85rem;text-decoration:none}
</style>
</head>
<body>
  <a href="/index.html"><img class="logo" src="/neurosarathi-logo-horizontal.png" alt="NeuroSarathi — Every Child Can Shine"></a>
  <div class="card">
    <h1>Create Account</h1>
    <p class="sub">Start your child's developmental journey today.</p>
    <input type="email" id="email" placeholder="Email address">
    <input type="password" id="password" placeholder="Password (min 6 characters)">
    <input type="password" id="confirmPassword" placeholder="Confirm password">

    <div class="consent-row">
      <input type="checkbox" id="agreeTerms">
      <label for="agreeTerms">I have read and agree to NeuroSarathi's <a href="/terms.html" target="_blank" rel="noopener">Terms & Conditions</a> and <a href="/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>. I understand this platform is educational only, not medical advice, and I use it at my own discretion.</label>
    </div>

    <button class="btn-primary" id="submitBtn" onclick="doSignup()">Create Account</button>
    <div class="msg" id="msg"></div>
    <div class="switch">Already have an account? <a href="/enterportal.html">Log in</a></div>
    <div class="back"><a href="/parents.html">← Back to NeuroSarathi</a></div>
  </div>

<script>
const SUPABASE_URL = "https://qvuenvngwgcknawfsnxl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2dWVudm5nd2dja25hd2ZzbnhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3MzI1OTksImV4cCI6MjA5ODMwODU5OX0.MZgac469tvi9Xq9gyaRbHDc9t88Ww9dN8ldZ8JvKGVI";
let sbClient = null;

try {
  sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  console.log('Supabase initialized successfully');
} catch (e) {
  console.error('Supabase initialization error:', e);
}

async function doSignup() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const agreeTerms = document.getElementById('agreeTerms').checked;
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');

  msg.className = 'msg';
  msg.textContent = '';

  if (!sbClient) {
    msg.className = 'msg error';
    msg.textContent = '❌ Backend connection failed. Please check your internet connection and try again.';
    return;
  }

  if (!email || !password || !confirmPassword) {
    msg.className = 'msg error';
    msg.textContent = '⚠️ Please fill in all fields.';
    return;
  }

  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(email)) {
    msg.className = 'msg error';
    msg.textContent = '⚠️ Please enter a valid email address.';
    return;
  }

  if (password.length < 6) {
    msg.className = 'msg error';
    msg.textContent = '⚠️ Password must be at least 6 characters long.';
    return;
  }

  if (password !== confirmPassword) {
    msg.className = 'msg error';
    msg.textContent = '⚠️ Passwords do not match.';
    return;
  }

  if (!agreeTerms) {
    msg.className = 'msg error';
    msg.textContent = '⚠️ Please agree to the Terms & Conditions and Privacy Policy to continue.';
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ Creating account…';

  try {
    const { data, error } = await sbClient.auth.signUp({
      email,
      password,
      options: {
        emailRedirectTo: window.location.origin + '/enterportal.html',
        data: {
          terms_accepted: true,
          terms_accepted_at: new Date().toISOString()
        }
      }
    });

    if (error) throw error;

    if (data?.user?.identities?.length === 0) {
      msg.className = 'msg error';
      msg.textContent = '⚠️ An account with this email already exists. Please log in instead.';
      btn.disabled = false;
      btn.textContent = 'Create Account';
      return;
    }

    msg.className = 'msg success';
    msg.textContent = '✅ Account created! Please check your email for verification. Redirecting...';

    setTimeout(() => {
      window.location.href = '/enterportal.html?verified=true';
    }, 3000);

  } catch (err) {
    let errorMessage = '❌ Something went wrong. Please try again.';

    if (err.message.includes('User already registered')) {
      errorMessage = '⚠️ An account with this email already exists. Please log in instead.';
    } else if (err.message) {
      errorMessage = `❌ ${err.message}`;
    }

    msg.className = 'msg error';
    msg.textContent = errorMessage;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Create Account';
  }
}

document.addEventListener('keydown', function(event) {
  if (event.key === 'Enter') {
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const confirm = document.getElementById('confirmPassword');
    if (document.activeElement === email ||
        document.activeElement === password ||
        document.activeElement === confirm) {
      doSignup();
    }
  }
});
</script>
</body>
</html>
