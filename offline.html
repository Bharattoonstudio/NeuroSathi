<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're offline — NeuroSarathi</title>
<link rel="icon" type="image/png" href="/images/favicon-32.png">
<style>
  body{font-family:system-ui,-apple-system,sans-serif;background:#f7fbfa;color:#134e4a;
       display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:24px;text-align:center}
  .box{max-width:360px}
  img{height:48px;margin-bottom:20px}
  h1{font-size:1.25rem;margin:0 0 8px}
  p{font-size:0.95rem;color:#3f5f5c;margin:0 0 20px}
  button{background:#0f766e;color:#fff;border:none;padding:12px 20px;border-radius:8px;font-size:0.95rem}
</style>
</head>
<body>
  <div class="box">
    <img src="/images/icon-192.png" alt="NeuroSarathi">
    <h1>You're offline</h1>
    <p>It looks like you've lost your connection. Please check your network and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
