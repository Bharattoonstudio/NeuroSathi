<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regression Alerts — NeuroSarathi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #fafafa;
            color: #333;
        }
        header {
            background: linear-gradient(135deg, #1f656f 0%, #34a0a4 100%);
            color: white;
            padding: 20px 0;
        }
        header h1 { margin: 0; font-size: 28px; }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0;
        }
        .btn-primary {
            background: #FF6B35;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-primary:hover { background: #e55a24; }
        .alerts-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .alert-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #FF6B35;
        }
        .alert-high {
            border-left-color: #dc3545;
            background: #fff5f5;
        }
        .alert-medium {
            border-left-color: #ff9800;
            background: #fff8f0;
        }
        .alert-low {
            border-left-color: #ffc107;
            background: #fffcf0;
        }
        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .alert-header h3 {
            color: #1f656f;
            margin: 0;
        }
        .alert-severity {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .alert-high .alert-severity {
            background: #dc3545;
            color: white;
        }
        .alert-medium .alert-severity {
            background: #ff9800;
            color: white;
        }
        .alert-low .alert-severity {
            background: #ffc107;
            color: #333;
        }
        .alert-domain {
            font-weight: 600;
            color: #666;
            margin-bottom: 8px;
        }
        .alert-description {
            color: #666;
            line-height: 1.5;
            margin-bottom: 12px;
        }
        .alert-values {
            display: flex;
            gap: 16px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 4px;
            margin: 12px 0;
            font-size: 14px;
        }
        .alert-action {
            padding: 12px;
            background: #f5f5f5;
            border-radius: 4px;
            border-left: 3px solid #FF6B35;
            margin: 12px 0;
        }
        .alert-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        .btn-small {
            background: #FF6B35;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-small:hover {
            background: #e55a24;
        }
        .alerts-empty {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .alerts-empty p {
            font-size: 18px;
            margin-bottom: 20px;
            color: #666;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 32px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group textarea,
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Progress Alerts</h1>
            <p>Monitor for regressions and development concerns</p>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h2>Your Alerts</h2>
            <button class="btn-primary" onclick="RegressionAlerts.detectRegressions(getChildId())">🔍 Check Now</button>
        </div>

        <div id="alerts-container"></div>
    </div>

    <div id="modal" class="modal"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/modules/regression-alerts.js"></script>
    <script>
        const supabase = window.supabaseClient;

        function getChildId() {
            return new URLSearchParams(window.location.search).get('id');
        }

        async function init() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                window.location.href = '/enterportal.html';
                return;
            }

            const childId = getChildId();
            if (childId) {
                await RegressionAlerts.renderAlerts(childId, 'alerts-container');
            } else {
                document.getElementById('alerts-container').innerHTML = '<p>Child ID not provided</p>';
            }
        }

        function showModal(html) {
            document.getElementById('modal').innerHTML = html;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        init();
    </script>
</body>
</html>
