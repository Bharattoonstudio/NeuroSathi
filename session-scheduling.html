<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Scheduling — NeuroSarathi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #fafafa;
            color: #333;
        }
        header {
            background: linear-gradient(135deg, #1f656f 0%, #34a0a4 100%);
            color: white;
            padding: 20px 0;
        }
        header h1 { margin: 0; font-size: 28px; }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0;
        }
        .btn-primary {
            background: #FF6B35;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-primary:hover { background: #e55a24; }
        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .card h2 {
            color: #1f656f;
            margin-bottom: 16px;
        }
        .calendar {
            margin: 20px 0;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-top: 16px;
        }
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: #f5f5f5;
            cursor: pointer;
            transition: background 0.2s;
        }
        .calendar-day:hover {
            background: #FFB703;
            color: white;
        }
        .calendar-day.selected {
            background: #FF6B35;
            color: white;
        }
        .upcoming-sessions {
            list-style: none;
        }
        .session-item {
            padding: 16px;
            background: #f5f5f5;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 4px solid #FF6B35;
        }
        .session-time {
            font-weight: 600;
            color: #1f656f;
        }
        .session-details {
            font-size: 14px;
            color: #666;
            margin-top: 8px;
        }
        .btn-small {
            background: #FF6B35;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 8px;
            margin-right: 4px;
        }
        .btn-small.secondary {
            background: #ccc;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 32px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Session Scheduling</h1>
            <p>Book and manage therapy sessions</p>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h2>Schedule Sessions</h2>
            <button class="btn-primary" onclick="showScheduleForm()">+ New Session</button>
        </div>

        <div class="content-grid">
            <div class="card">
                <h2>Calendar</h2>
                <div id="calendar"></div>
            </div>

            <div class="card">
                <h2>Upcoming Sessions</h2>
                <ul class="upcoming-sessions" id="sessionsList"></ul>
            </div>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h2>Session History</h2>
            <table style="width: 100%; border-collapse: collapse;" id="sessionHistory">
                <thead>
                    <tr style="border-bottom: 2px solid #ddd;">
                        <th style="text-align: left; padding: 12px;">Date</th>
                        <th style="text-align: left; padding: 12px;">Child</th>
                        <th style="text-align: left; padding: 12px;">Status</th>
                        <th style="text-align: left; padding: 12px;">Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="modal" class="modal"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/modules/session-scheduling.js"></script>
    <script>
        const supabase = window.supabaseClient;

        async function init() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                window.location.href = '/enterportal.html';
                return;
            }

            await loadUpcomingSessions(user.id);
            await loadSessionHistory(user.id);
        }

        async function loadUpcomingSessions(userId) {
            const sessions = await SessionScheduling.getUpcomingSessions(userId, 14);
            const list = document.getElementById('sessionsList');
            
            if (sessions.length === 0) {
                list.innerHTML = '<li>No upcoming sessions</li>';
                return;
            }

            list.innerHTML = sessions.map(s => `
                <li class="session-item">
                    <div class="session-time">${s.session_date} at ${s.session_time}</div>
                    <div class="session-details">
                        <div>Child: ${s.children[0]?.name || 'Unknown'}</div>
                        <div>Type: ${s.therapy_plans[0]?.therapy_type || 'Therapy'}</div>
                        <div>Location: ${s.location}</div>
                    </div>
                    <button class="btn-small" onclick="SessionScheduling.updateSessionStatus('${s.id}', 'in_progress')">Start</button>
                    <button class="btn-small secondary" onclick="showRescheduleForm('${s.id}')">Reschedule</button>
                </li>
            `).join('');
        }

        async function loadSessionHistory(userId) {
            // Get completed sessions
            const { data: sessions } = await supabase
                .from('scheduled_sessions')
                .select('*')
                .eq('therapist_id', userId)
                .in('status', ['completed', 'cancelled'])
                .order('session_date', { ascending: false })
                .limit(10);

            const tbody = document.querySelector('#sessionHistory tbody');
            if (!sessions || sessions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">No session history</td></tr>';
                return;
            }

            tbody.innerHTML = sessions.map(s => `
                <tr style="border-bottom: 1px solid #eee;">
                    <td style="padding: 12px;">${s.session_date}</td>
                    <td style="padding: 12px;">Child ID: ${s.child_id}</td>
                    <td style="padding: 12px;">${s.status}</td>
                    <td style="padding: 12px;">
                        <button class="btn-small" onclick="showSessionDetails('${s.id}')">Details</button>
                    </td>
                </tr>
            `).join('');
        }

        function showScheduleForm() {
            const childId = new URLSearchParams(window.location.search).get('child_id');
            const therapistId = new URLSearchParams(window.location.search).get('therapist_id');
            const parentId = new URLSearchParams(window.location.search).get('parent_id');
            const therapyPlanId = new URLSearchParams(window.location.search).get('therapy_plan_id');

            if (!childId || !therapistId || !parentId || !therapyPlanId) {
                alert('Missing required parameters');
                return;
            }

            SessionScheduling.showScheduleModal(therapyPlanId, childId, therapistId, parentId);
        }

        function showModal(html) {
            document.getElementById('modal').innerHTML = html;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        init();
    </script>
</body>
</html>
