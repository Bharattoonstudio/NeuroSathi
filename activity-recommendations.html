<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Recommendations — NeuroSarathi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #fafafa;
            color: #333;
        }
        header {
            background: linear-gradient(135deg, #1f656f 0%, #34a0a4 100%);
            color: white;
            padding: 20px 0;
        }
        header h1 { margin: 0; font-size: 28px; }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0;
        }
        .btn-primary {
            background: #FF6B35;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-primary:hover { background: #e55a24; }
        .recommendations-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .recommendation-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #FF6B35;
        }
        .recommendation-card h3 {
            color: #1f656f;
            margin-bottom: 8px;
        }
        .domain-tag {
            display: inline-block;
            background: #FFB703;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 12px;
        }
        .description {
            color: #666;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .recommendation-details {
            display: flex;
            gap: 16px;
            margin: 12px 0;
            font-size: 14px;
            flex-wrap: wrap;
        }
        .recommendation-details span {
            background: #f5f5f5;
            padding: 6px 12px;
            border-radius: 4px;
        }
        .evidence {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 4px;
            margin: 12px 0;
            font-size: 14px;
            border-left: 3px solid #FFB703;
        }
        .feedback-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #eee;
        }
        .feedback-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        .btn-small {
            background: #1f656f;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 8px;
        }
        .btn-small:hover {
            background: #155260;
        }
        .recommendations-empty {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .recommendations-empty p {
            margin-bottom: 20px;
            color: #666;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #28a745;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Activity Recommendations</h1>
            <p>AI-powered personalized activity suggestions</p>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h2>Personalized Activities</h2>
            <button class="btn-primary" onclick="ActivityRecommendations.handleGenerateClick(event)">🤖 Generate New</button>
        </div>

        <div id="recommendations-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/modules/activity-recommendations.js"></script>
    <script>
        const supabase = window.supabaseClient;

        async function init() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                window.location.href = '/enterportal.html';
                return;
            }

            const childId = new URLSearchParams(window.location.search).get('id');
            if (childId) {
                await ActivityRecommendations.renderRecommendations(childId, 'recommendations-container');
            } else {
                document.getElementById('recommendations-container').innerHTML = '<p>Child ID not provided</p>';
            }
        }

        init();
    </script>
</body>
</html>
